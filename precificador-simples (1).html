<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precificador de Piscicultura</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:#f4f8fa;color:#12303b;padding-bottom:60px}
header{background:#0e7490;color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:1.15rem}
header p{margin:3px 0 0;font-size:.8rem;opacity:.9}
.wrap{max-width:860px;margin:0 auto;padding:14px}
section{background:#fff;border:1px solid #dde7ec;border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:1rem;margin:0 0 8px;color:#0e7490}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
label{display:block;font-size:.75rem;font-weight:600;color:#5b7784;margin:0 0 3px}
input,select{width:100%;padding:8px;border:1px solid #dde7ec;border-radius:7px;font-size:.9rem;background:#fff;color:#12303b;min-height:38px}
input:focus,select:focus{outline:2px solid #0f9ba8;border-color:#0f9ba8}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.card{background:#f7fbfc;border:1px solid #dde7ec;border-radius:10px;padding:10px}
.card .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.03em;color:#5b7784;font-weight:700}
.card .val{font-size:1.05rem;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.card .sub{font-size:.7rem;color:#5b7784;margin-top:2px}
.v-green{color:#15803d}.v-orange{color:#b45309}.v-blue{color:#1d4ed8}.v-purple{color:#7e22ce}.v-red{color:#b91c1c}
table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
th{background:#eef5f7;text-align:left;padding:6px;font-size:.72rem;color:#5b7784;border-bottom:1px solid #dde7ec}
td{padding:5px 6px;border-bottom:1px solid #e8eff2}
td.calc{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{background:#e6f4f6;font-weight:800}
.barra{position:fixed;left:0;right:0;bottom:0;background:#0d1b20;color:#e5f1f5;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;z-index:20}
.barra button{background:#0f9ba8;color:#06222a;border:0;border-radius:8px;padding:8px 12px;font-size:.82rem;font-weight:700;cursor:pointer;min-height:38px}
.barra button:hover{background:#2dd4bf}
.barra button.sec{background:transparent;border:1px solid #26414b;color:#9db4bd}
footer{max-width:860px;margin:18px auto 0;padding:12px 16px;font-size:.7rem;color:#5b7784;border-top:1px solid #dde7ec}
@media(max-width:640px){.wrap{padding:10px}}
</style>
</head>
<body>
<header>
<h1>🐟 Precificador de Piscicultura</h1>
<p>Método Embrapa (Casaca &amp; Queiróz) · cálculos conectados · funciona offline</p>
</header>
<div class="wrap"><div id="app"></div></div>
<footer id="rodape"></footer>
<div class="barra" id="barra"></div>
<script>

/* ===== MOTOR (validado) ===== */
const defValue = v => (v === "" || v === null || v === undefined ? 0 : Number(v));
const seguranca = x => (typeof x === "number" && isFinite(x) && !isNaN(x) ? x : 0);
const fmt = (v, d = 2) => { if (v === null || v === undefined) return "—"; if (typeof v !== "number" || !isFinite(v) || isNaN(v)) return "—"; return v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }); };
const fmtMoeda = v => { if (v === null || v === undefined) return "—"; if (typeof v !== "number" || !isFinite(v) || isNaN(v)) return "—"; return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); };

function computeAll(S) {
  const q = S.quantitativos, p = S.percentuais, cul = S.cultivo;
  const periodoCultivo = cul.dataEstocagem && cul.dataDespesca ? Math.round((new Date(cul.dataDespesca) - new Date(cul.dataEstocagem)) / 86400000) : 0;
  const totalMaquinas = S.maquinas.reduce((s, i) => s + defValue(i.qtd) * defValue(i.preco), 0);
  const totalMateriais = S.materiais.reduce((s, i) => s + defValue(i.qtd) * defValue(i.preco), 0) + defValue(S.maoDeObraConstrucao);
  const valorEquipamentos = S.equipamentos.reduce((s, i) => s + defValue(i.qtd) * defValue(i.preco), 0);
  const deprecEquip = S.equipamentos.reduce((s, i) => s + (defValue(i.vidaUtil) > 0 ? (defValue(i.qtd) * defValue(i.preco)) / defValue(i.vidaUtil) : 0), 0);
  const alevinosTotalQtd = defValue(q.alevinosQtd);
  const alevinosPrecoMedio = alevinosTotalQtd > 0 ? (alevinosTotalQtd * defValue(q.alevinosPrecoUnit)) / alevinosTotalQtd : 0;
  const producaoTotalKg = S.especies.reduce((s, e) => s + defValue(e.qtd), 0);
  const receitaPescado = S.especies.reduce((s, e) => s + defValue(e.qtd) * defValue(e.precoUnit), 0);
  const receitaBruta = receitaPescado + defValue(S.outrasReceitas);
  const precoMedioVenda = producaoTotalKg > 0 ? receitaPescado / producaoTotalKg : 0;
  const pesoMedioFinalGlobal = producaoTotalKg > 0 ? (S.especies.reduce((s, e) => s + defValue(e.qtd) * defValue(e.pesoMedioFinal), 0) / producaoTotalKg) : 0;
  const depConstrucao = defValue(S.vidaUtilConstrucao) > 0 ? (totalMaquinas / defValue(S.vidaUtilConstrucao)) * 0.9 : 0;
  const depAbastecimento = defValue(S.vidaUtilConstrucao) > 0 ? (totalMateriais / defValue(S.vidaUtilConstrucao)) * 0.9 : 0;
  const custoTotalViveiro = totalMaquinas + totalMateriais + valorEquipamentos;
  const depreciacaoAnualTotal = depConstrucao + depAbastecimento + deprecEquip;
  const coeItens = [
    { nome: "Alevinos", valor: alevinosTotalQtd * alevinosPrecoMedio },
    { nome: "Mão de obra + encargos", valor: defValue(q.maoDeObraCultivoHoras) * defValue(q.maoDeObraCultivoValor) },
    { nome: "Alimentação/ração", valor: defValue(q.racao1Qtd) * defValue(q.racao1Preco) + defValue(q.racao2Qtd) * defValue(q.racao2Preco) },
    { nome: "Fertilizantes orgânicos", valor: defValue(q.fertOrg1Qtd) * defValue(q.fertOrg1Preco) + defValue(q.fertOrg2Qtd) * defValue(q.fertOrg2Preco) },
    { nome: "Fertilizantes químicos", valor: defValue(q.fertQuim1Qtd) * defValue(q.fertQuim1Preco) + defValue(q.fertQuim2Qtd) * defValue(q.fertQuim2Preco) },
    { nome: "Calagem", valor: defValue(q.calcarioQtd) * defValue(q.calcarioPreco) + defValue(q.calVirgemQtd) * defValue(q.calVirgemPreco) },
    { nome: "Combustível", valor: defValue(q.combustivelQtd) * defValue(q.combustivelPreco) },
    { nome: "Energia elétrica", valor: defValue(q.energiaQtd) * defValue(q.energiaPreco) },
    { nome: "Análise da água", valor: defValue(q.analiseAguaQtd) * defValue(q.analiseAguaPreco) },
    { nome: "Transporte", valor: defValue(q.transporteQtd) * defValue(q.transportePreco) },
    { nome: "Assistência técnica", valor: defValue(q.assistenciaQtd) * defValue(q.assistenciaPreco) },
    { nome: "Gastos administrativos e financeiros", valor: defValue(q.gastosAdm) },
    { nome: "Medicamentos e produtos químicos", valor: defValue(q.medicamentos) },
    { nome: "Outros custos operacionais", valor: defValue(q.outrosOperacionais) },
    { nome: "Manutenção", valor: defValue(S.manutencaoConstrucao) + defValue(S.manutencaoEquipamentos) },
    { nome: "Arrendamento", valor: defValue(q.arrendamento) }
  ];
  const coeTotal = coeItens.reduce((s, i) => s + i.valor, 0);
  const cotTotal = coeTotal + defValue(q.proLaboreSalario) + depreciacaoAnualTotal;
  const jurosCapital = (defValue(p.jurosCapital) / 100) * custoTotalViveiro;
  const jurosTerra = defValue(q.precoTerra) * defValue(q.terraHa) * defValue(p.jurosTerra) / 100;
  const custoOportunidade = jurosCapital + jurosTerra;
  const custoTotal = cotTotal + custoOportunidade;
  const racaoQtdTotal = defValue(q.racao1Qtd) + defValue(q.racao2Qtd);
  const biomassaInicial = (defValue(q.alevinosPesoMedio) * alevinosTotalQtd) / 1000;
  const ind = {
    periodoCultivo, areaViveiro: defValue(cul.areaViveiro),
    quantidadePeixes: seguranca(producaoTotalKg / pesoMedioFinalGlobal),
    densidade: seguranca(alevinosTotalQtd / (defValue(cul.areaViveiro) * 10000)),
    sobrevivencia: seguranca(((producaoTotalKg * 1000 / pesoMedioFinalGlobal) * 100) / alevinosTotalQtd),
    taxaCrescimento: seguranca((pesoMedioFinalGlobal - defValue(q.alevinosPesoMedio)) / periodoCultivo),
    produtividade: seguranca(producaoTotalKg * 365 / (defValue(cul.areaViveiro) * periodoCultivo)),
    conversaoAlimentar: seguranca(racaoQtdTotal / (producaoTotalKg - biomassaInicial)),
    rb: receitaBruta, rbKg: seguranca(receitaBruta / producaoTotalKg),
    coe: coeTotal, coeKg: seguranca(coeTotal / producaoTotalKg),
    cot: cotTotal, cotKg: seguranca(cotTotal / producaoTotalKg),
    ct: custoTotal, ctKg: seguranca(custoTotal / producaoTotalKg),
    mbu: seguranca((receitaBruta - coeTotal) / producaoTotalKg),
    mb: seguranca(((receitaBruta - coeTotal) / receitaBruta) * 100),
    mlu: seguranca((receitaBruta - cotTotal) / producaoTotalKg),
    ml: seguranca(((receitaBruta - cotTotal) / receitaBruta) * 100),
    nivelamentoCOE: seguranca(coeTotal / precoMedioVenda),
    nivelamentoCOT: seguranca(cotTotal / precoMedioVenda),
    prelonCOE: seguranca(coeTotal / producaoTotalKg),
    prelonCOT: seguranca(cotTotal / producaoTotalKg),
    pontoEquilibrioOp: seguranca(depreciacaoAnualTotal / (precoMedioVenda - seguranca(coeTotal / producaoTotalKg))),
    custoRacaoKg: seguranca((defValue(q.racao1Qtd) * defValue(q.racao1Preco) + defValue(q.racao2Qtd) * defValue(q.racao2Preco)) / producaoTotalKg),
    custoFertKg: seguranca((defValue(q.fertOrg1Qtd) * defValue(q.fertOrg1Preco) + defValue(q.fertOrg2Qtd) * defValue(q.fertOrg2Preco)) / producaoTotalKg),
    custoMaoObraKg: seguranca((defValue(q.maoDeObraCultivoHoras) * defValue(q.maoDeObraCultivoValor) + defValue(q.proLaboreSalario)) / producaoTotalKg),
    recuperacaoCapital: seguranca(custoTotalViveiro / ((receitaBruta - cotTotal) + depreciacaoAnualTotal)),
    custoImplantacao: custoTotalViveiro
  };
  return { S, D: { periodoCultivo, totalMaquinas, totalMateriais, valorEquipamentos, depConstrucao, depAbastecimento, deprecEquip, custoTotalViveiro, depreciacaoAnualTotal, coeItens, coeTotal, cotTotal, jurosCapital, jurosTerra, custoOportunidade, custoTotal, producaoTotalKg, receitaBruta, precoMedioVenda, pesoMedioFinalGlobal, alevinosTotalQtd, ind, dolar: defValue(S.dolar), margemMarkup: defValue(S.margemMarkup), markupModalidade: S.markupModalidade } };
}

/* ===== ESTADO DEFAULT ===== */
function hojeISO() { const d = new Date(); const off = d.getTimezoneOffset(); return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10); }
function defaultState() {
  return {
    cultivo: { produtor: "", localidade: "", municipio: "", dataAnalise: hojeISO(), numeroViveiro: "V1", areaViveiro: 5, numeroCultivo: "C1", dataEstocagem: "2026-04-01", dataDespesca: "2026-09-30", elaborador: "" },
    especies: [{ nome: "Tilápia", qtd: 4500, precoUnit: 9.5, pesoMedioFinal: 800 }],
    outrasReceitas: 0, dolar: 5.4,
    percentuais: { jurosCapital: 10, jurosTerra: 6, producaoEstercoDia: 0, materiaSecaEsterco: 0 },
    quantitativos: {
      alevinosQtd: 5000, alevinosPrecoUnit: 0.35, alevinosPesoMedio: 5, animais: 0, pesoAnimais: 0,
      terraHa: 5, precoTerra: 20000, horasMaquinaManual: 0, comprimentoAterro: 0, alturaAterro: 0, baseMaiorAterro: 0, baseMenorAterro: 0,
      racao1Qtd: 4000, racao1Preco: 6.5, racao2Qtd: 3000, racao2Preco: 5.5,
      fertOrg1Qtd: 0, fertOrg1Preco: 0, fertOrg2Qtd: 0, fertOrg2Preco: 0,
      fertQuim1Qtd: 0, fertQuim1Preco: 0, fertQuim2Qtd: 0, fertQuim2Preco: 0,
      calcarioQtd: 0, calcarioPreco: 0, calVirgemQtd: 0, calVirgemPreco: 0,
      combustivelQtd: 0, combustivelPreco: 0, energiaQtd: 0, energiaPreco: 0,
      analiseAguaQtd: 1, analiseAguaPreco: 300, transporteQtd: 0, transportePreco: 0,
      assistenciaQtd: 0, assistenciaPreco: 0, gastosAdm: 0, medicamentos: 0, outrosOperacionais: 0,
      maoDeObraCultivoHoras: 100, maoDeObraCultivoValor: 12, proLaboreSalario: 2400, arrendamento: 0
    },
    maquinas: [{ nome: "Máquinas de construção", qtd: 60, preco: 80, vidaUtil: 10 }],
    materiais: [{ nome: "Tubulação e materiais hidráulicos", qtd: 100, preco: 50, vidaUtil: 10 }],
    equipamentos: [{ nome: "Aerador/bomba", qtd: 2, preco: 3000, vidaUtil: 5 }],
    vidaUtilConstrucao: 10, manutencaoConstrucao: 0, manutencaoEquipamentos: 0, maoDeObraConstrucao: 5000,
    biometrias: [{ data: "", pesoMedio: "" }], analises: null,
    margemMarkup: 30, markupModalidade: "cot"
  };
}

/* ===== PERSISTÊNCIA ===== */
const KEY = "precipisc_simples_v1";
let statusSalvar = "";
function salvar() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    const ag = new Date();
    statusSalvar = "Salvo automaticamente às " + ag.toLocalTimeString?.("pt-BR") || "";
    const badge = document.getElementById("badge");
    if (badge) badge.textContent = statusSalvar || "Dados salvos neste navegador ✅";
  } catch (e) { statusSalvar = "Não foi possível salvar automaticamente"; }
}
function carregar() {
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}



/* ===== ESTADO GLOBAL ===== */
let S = carregar() || defaultState();

/* ===== HELPERS DE FORMULÁRIO ===== */
function esc(s) { return String(s === null || s === undefined ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function escAttr(s) { return String(s === null || s === undefined ? "" : s).replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
function inpNum(val, path) {
  const v = (val === null || val === undefined || val === "") ? "" : String(val).replace(".", ",");
  return '<input class="num" type="text" inputmode="decimal" value="' + escAttr(v) + '" data-path="' + escAttr(path) + '">';
}
function inpDate(val, path) {
  return '<input type="date" value="' + escAttr(val || "") + '" data-path="' + escAttr(path) + '">';
}
function inpTxt(val, path) {
  return '<input type="text" value="' + escAttr(val || "") + '" data-path="' + escAttr(path) + '">';
}
function selOpcoes(val, path, opcoes) {
  return '<select data-path="' + escAttr(path) + '">' + opcoes.map(o => '<option value="' + escAttr(o.v) + '"' + (String(val) === String(o.v) ? " selected" : "") + ">" + esc(o.l) + "</option>").join("") + "</select>";
}

/* ===== SAÍDAS — preenche resultados calculados ===== */
function label(txt, html) { return '<label>' + txt + '<br>' + html + '</label>'; }

function saidasHTML() {
  const R = computeAll(S), D = R.D, ind = D.ind;
  return "" +
    '<div class="res">' +
      cardVal("Receita Bruta", "<span id='saida-receita'>" + fmtMoeda(D.receitaBruta) + "</span>", fmtMoeda(ind.rbKg) + "/kg", "blue") +
      cardVal("Custo Operacional (COE)", "<span id='saida-coe'>" + fmtMoeda(ind.coe) + "</span>", fmtMoeda(ind.coeKg) + "/kg", "orange") +
      cardVal("Custo Total (CT)", "<span id='saida-ct'>" + fmtMoeda(ind.ct) + "</span>", fmtMoeda(ind.ctKg) + "/kg", "purple") +
      cardVal("Margem Líquida Unit.", "<span id='saida-mlu'>" + fmtMoeda(ind.mlu) + "</span>", "ML " + fmt(ind.ml, 1) + "%", ind.mlu >= 0 ? "green" : "red") +
      cardVal("Produtividade", "<span id='saida-produtiv'>" + fmt(ind.produtividade, 0) + "</span> kg/ha/ano", null, "blue") +
      cardVal("Sobrevivência", "<span id='saida-sobrev'>" + fmt(ind.sobrevivencia, 1) + "</span>%", null, "orange") +
    '</div>';
}
function card(lbl, val, sub, cor) {
  return '<div class="card"><div class="lbl">' + lbl + '</div><div class="val v-' + cor + '">' + val + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : "") + '</div>';
}

/* ===== RENDER PRINCIPAL ===== */
function render() {
  const R = computeAll(S);
  const D = R.D, q = S.quantitativos;
  const root = document.getElementById("app");
  let h = "";

  /* Bloco A — Dados gerais */
  h += '<section><h2>① Dados do cultivo</h2><div class="g">' +
    label("Produtor / Responsável", inpTxt(S.cultivo.produtor, "cultivo.produtor")) +
    label("Localidade / Propriedade", inpTxt(S.cultivo.localidade, "cultivo.localidade")) +
    label("Município/UF", inpTxt(S.cultivo.municipio, "cultivo.municipio")) +
    label("Viveiro nº", inpTxt(S.cultivo.numeroViveiro, "cultivo.numeroViveiro")) +
    label("Área do viveiro (ha)", inpNum(S.cultivo.areaViveiro, "cultivo.areaViveiro")) +
    label("Data estocagem", inpDate(S.cultivo.dataEstocagem, "cultivo.dataEstocagem")) +
    label("Data despesca", inpDate(S.cultivo.dataDespesca, "cultivo.dataDespesca")) +
    label("Período de análise", inpDate(S.cultivo.dataAnalise, "cultivo.dataAnalise")) +
  '</div></section>';

  /* Bloco B — Receitas */
  const sp = S.especies[0];
  h += '<section><h2>② Produção & receitas</h2><div class="g">' +
    label("Produção total colhida (kg)", inpNum(sp.qtd, "especies.0.qtd")) +
    label("Preço de venda médio (R$/kg)", inpNum(sp.precoUnit, "especies.0.precoUnit")) +
    label("Peso médio final dos peixes (g)", inpNum(sp.pesoMedioFinal, "especies.0.pesoMedioFinal")) +
    label("Outras receitas (R$)", inpNum(S.outrasReceitas, "outrasReceitas")) +
  '</div></section>';

  /* Bloco C — Custos operacionais principais */
  h += '<section><h2>③ Custos operacionais</h2><div class="g">' +
    label("Alevinos (milheiros? unidade)", inpNum(q.alevinosQtd, "quantitativos.alevinosQtd")) +
    label("Preço por alevino (R$)", inpNum(q.alevinosPrecoUnit, "quantitativos.alevinosPrecoUnit")) +
    label("Peso inicial alevinos (g)", inpNum(q.alevinosPesoMedio, "quantitativos.alevinosPesoMedio")) +
    label("Ração 1 — quantidade (un.)", inpNum(q.racao1Qtd, "quantitativos.racao1Qtd")) +
    label("Ração 1 — preço unitário (R$)", inpNum(q.racao1Preco, "quantitativos.racao1Preco")) +
    label("Ração 2 — quantidade (un.)", inpNum(q.racao2Qtd, "quantitativos.racao2Qtd")) +
    label("Ração 2 — preço unitário (R$)", inpNum(q.racao2Preco, "quantitativos.racao2Preco")) +
    label("Mão de obra (horas)", inpNum(q.maoDeObraCultivoHoras, "quantitativos.maoDeObraCultivoHoras")) +
    label("Mão de obra — valor/hora (R$)", inpNum(q.maoDeObraCultivoValor, "quantitativos.maoDeObraCultivoValor")) +
    label("Pró-labore mensal (R$)", inpNum(q.proLaboreSalario, "quantitativos.proLaboreSalario")) +
    label("Combustível — qty", inpNum(q.combustivelQtd, "quantitativos.combustivelQtd")) +
    label("Combustível — preço (R$)", inpNum(q.combustivelPreco, "quantitativos.combustivelPreco")) +
    label("Energia elétrica — qty", inpNum(q.energiaQtd, "quantitativos.energiaQtd")) +
    label("Energia — preço (R$)", inpNum(q.energiaPreco, "quantitativos.energiaPreco")) +
    label("Análises água — nº", inpNum(q.analiseAguaQtd, "quantitativos.analiseAguaQtd")) +
    label("Análise água — preço (R$)", inpNum(q.analiseAguaPreco, "quantitativos.analiseAguaPreco")) +
  '</div><details style="margin-top:10px"><summary style="cursor:pointer;font-size:.85rem;color:#0e7490;font-weight:600">Mais itens (fertilizantes, transporte etc.)</summary><div class="g" style="margin-top:8px">' +
    label("Fertorgânico 1 — qty/preço", inpNum(q.fertOrg1Qtd, "quantitativos.fertOrg1Qtd") + '<div style="height:6px"></div>' + inpNum(q.fertOrg1Preco, "quantitativos.fertOrg1Preco")) +
    label("Fertquímico 1 — qty/preço", inpNum(q.fertQuim1Qtd, "quantitativos.fertQuim1Qtd") + '<div style="height:6px"></div>' + inpNum(q.fertQuim1Preco, "quantitativos.fertQuim1Preco")) +
    label("Calagem — qty/preço", inpNum(q.calcarioQtd, "quantitativos.calcarioQtd") + '<div style="height:6px"></div>' + inpNum(q.calcarioPreco, "quantitativos.calcarioPreco")) +
    label("Transporte — qty/preço", inpNum(q.transporteQtd, "quantitativos.transporteQtd") + '<div style="height:6px"></div>' + inpNum(q.transportePreco, "quantitativos.transportePreco")) +
    label("Assistência técnica — qty/preço", inpNum(q.assistenciaQtd, "quantitativos.assistenciaQtd") + '<div style="height:6px"></div>' + inpNum(q.assistenciaPreco, "quantitativos.assistenciaPreco")) +
    label("Gastos administrativos (R$)", inpNum(q.gastosAdm, "quantitativos.gastosAdm")) +
    label("Medicamentos (R$)", inpNum(q.medicamentos, "quantitativos.medicamentos")) +
    label("Outros custos operacionais (R$)", inpNum(q.outrosOperacionais, "quantitativos.outrosOperacionais")) +
    label("Arrendamento (R$)", inpNum(q.arrendamento, "quantitativos.arrendamento")) +
    label("Manutenção construção + equip. (R$)", inpNum(S.manutencaoConstrucao, "manutencaoConstrucao") + '<div style="height:6px"></div>' + inpNum(S.manutencaoEquipamentos, "manutencaoEquipamentos")) +
  '</div></details>' +
  saidasHTML() + '</section>';

  /* Bloco D — Implantação simplificada */
  const m = S.maquinas[0], mat = S.materiais[0], eq = S.equipamentos[0];
  h += '<section><h2>④ Custo de implantação do viveiro</h2><div class="g">' +
    label("Máquinas/construção — qtde", inpNum(m.qtd, "maquinas.0.qtd")) +
    label("Máquinas — custo unit. (R$)", inpNum(m.preco, "maquinas.0.preco")) +
    label("Vida útil das máquinas (anos)", inpNum(S.vidaUtilConstrucao, "vidaUtilConstrucao")) +
    label("Tubulação/materiais — qtde", inpNum(mat.qtd, "materiais.0.qtd")) +
    label("Tubulação — custo unit. (R$)", inpNum(mat.preco, "materiais.0.preco")) +
    label("Equipamentos — qtde", inpNum(eq.qtd, "equipamentos.0.qtd")) +
    label("Equipamentos — custo unit. (R$)", inpNum(eq.preco, "equipamentos.0.preco")) +
    label("Equipamentos — vida útil (anos)", inpNum(eq.vidaUtil, "equipamentos.0.vidaUtil")) +
    label("M.O. construção (R$)", inpNum(S.maoDeObraConstrucao, "maoDeObraConstrucao")) +
  '</div></section>';

  /* Bloco E — Juros/capital terra */
  h += '<section><h2>⑤ Capital e juros (%)</h2><div class="g">' +
    label("Juros sobre capital mobilizado (% ano)", inpNum(S.percentuais.jurosCapital, "percentuais.jurosCapital")) +
    label("Terra (ha)", inpNum(q.terraHa, "quantitativos.terraHa")) +
    label("Valor da terra (R$/ha)", inpNum(q.precoTerra, "quantitativos.precoTerra")) +
    label("Juros sobre a terra (% ano)", inpNum(S.percentuais.jurosTerra, "percentuais.jurosTerra")) +
  '</div></section>';

  /* Bloco F — Preço sugerido */
  h += '<section><h2>⑥ Precificação sugerida</h2><div class="g">' +
    label("Base para precificação", selOpcoes(S.markupModalidade, "markupModalidade", [{v:"cot",l:"COT (custo operacional total)"},{v:"ct",l:"CT (custo total)"}])) +
    label("Margem desejada (%)", inpNum(S.margemMarkup, "margemMarkup")) +
  '</div><div id="preco-saida"></div></section>';

  root.innerHTML = h;
  atualizarPrecos();
  rodape();
}

function atualizarPrecos() {
  const R = computeAll(S), D = R.D, ind = D.ind;
  const base = D.markupModalidade === "ct" ? ind.ctKg : ind.cotKg;
  const preco = base * (1 + D.margemMarkup / 100);
  const lucro = preco > base ? preco - base : 0;
  const el = document.getElementById("preco-saida");
  if (el) {
    el.innerHTML = '<div class="res">' +
      card("Base (R$/kg)", fmtMoeda(base), D.markupModalidade === "ct" ? "CT/kg" : "COT/kg", "blue") +
      card("Preço sugerido (R$/kg)", fmtMoeda(preco), "+" + D.margemMarkup + "% de margem", "green") +
      card("Lucro por kg", fmtMoeda(lucro), null, "purple") +
    '</div>';
  }
}

function rodape() {
  const rod = document.getElementById("rodape");
  if (!rod) return;
  rod.innerHTML = "Base metodológica: planilhas Embrapa de Jorge de Matos Casaca e Fernanda Queiróz e Silva. Aplicativo offline — seus dados ficam neste navegador.";
}

/* ===== EVENTOS: atualiza cálculo ao digitar ===== */
document.addEventListener("input", function(ev) {
  const el = ev.target;
  if (!el || !el.getAttribute || !el.getAttribute("data-path")) return;
  const path = el.getAttribute("data-path");
  let valor = el.value;
  if (el.type === "text" || el.inputMode === "decimal") {
    valor = valor.replace(/\./g, "").replace(",", ".").trim();
    if (/^-?\d*\.?\d*$/.test(valor) && valor !== "" && valor !== "-") valor = Number(valor);
  } else if (el.tagName === "SELECT") {
    // mantém string se não numérico
    if (!/^ *-?\d*\.?\d*$/.test(valor) || valor === "") { /* string normal */ }
  }
  setPath(S, path, valor);
  salvar();
  recalculaUI();
});
function cardVal(lbl, valHtml, sub, cor) {
  return '<div class="card"><div class="lbl">' + lbl + '</div><div class="val v-' + cor + '">' + valHtml + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : "") + '</div>';
}
function setPath(obj, path, val) {
  const parts = path.split(".");
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) { cur = cur[parts[i]]; if (!cur) return; }
  cur[parts[parts.length - 1]] = val;
}
function recalculaUI() {
  // Atualiza só as saídas sem reconstruir inputs (mantém foco do usuário)
  const R = computeAll(S), D = R.D, ind = D.ind;
  const map = {
    "saida-receita": fmtMoeda(D.receitaBruta),
    "saida-coe": fmtMoeda(ind.coe),
    "saida-ct": fmtMoeda(ind.ct),
    "saida-mlu": fmtMoeda(ind.mlu) + " (" + fmt(ind.ml, 1) + "%)",
    "saida-produtiv": fmt(ind.produtividade, 0) + " kg/ha/ano",
    "saida-sobrev": fmt(ind.sobrevivencia, 1) + "%"
  };
  Object.keys(map).forEach(id => { const e = document.getElementById(id); if (e) e.textContent = map[id]; });
  atualizarPrecos();
}

/* ===== BOTÕES DA BARRA INFERIOR ===== */
function montarBarra() {
  const b = document.getElementById("barra");
  b.innerHTML =
    '<span id="badge" style="font-size:.78rem;color:#9db4bd;margin-right:auto"></span>' +
    '<button id="btn-print">🖨️ Imprimir/PDF</button>' +
    '<button id="btn-export" class="sec">💾 Salvar arquivo</button>' +
    '<button id="btn-import" class="sec">📂 Carregar arquivo</button>' +
    '<button id="btn-reset" class="sec">↺ Reiniciar</button>';
  document.getElementById("btn-print").onclick = () => window.print();
  document.getElementById("btn-export").onclick = exportarJSON;
  document.getElementById("btn-import").onclick = () => document.getElementById("file-import").click();
  document.getElementById("btn-reset").onclick = () => {
    if (confirm("Isso vai apagar todos os dados digitados nesta página. Continuar?")) { S = defaultState(); localStorage.removeItem(KEY); render(); }
  };
}

/* ===== IMPORT/EXPORT ===== */
function exportarJSON() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "precificador-dados.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function importarJSON(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = function() {
    try {
      const st = JSON.parse(fr.result);
      if (st && typeof st === "object") { S = st; if (!S.biometrias) S.biometrias = [{data:"",pesoMedio:""}]; if (!S.analises) S.analises = null; if (S.margemMarkup === undefined) S.margemMarkup = 30; if (!S.markupModalidade) S.markupModalidade = "cot"; salvar(); render(); }
    } catch (e) { alert("Não foi possível ler o arquivo."); }
  };
  fr.readAsText(file);
}

/* ===== INICIALIZAÇÃO ===== */
function boot() {
  montarBarra();
  render();
  const badge = document.getElementById("badge");
  if (badge) badge.textContent = "Dados salvos neste navegador ✅";
  const inpFile = document.createElement("input");
  inpFile.type = "file"; inpFile.id = "file-import"; inpFile.accept = ".json,application/json";
  inpFile.style.display = "none";
  document.body.appendChild(inpFile);
  inpFile.onchange = e => importarJSON(e.target.files[0]);
}
boot();
