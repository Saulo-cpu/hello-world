<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precificador de Piscicultura</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f4f8fa;color:#12303b;margin:0;padding:20px}
.container{max-width:800px;margin:0 auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
h1{color:#0e7490;font-size:1.5rem;margin-top:0}
p{color:#5b7784;line-height:1.5}
.btn{background:#0e7490;color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;margin-top:10px}
.btn:hover{background:#0b5d72}
</style>
</head>
<body>
<div class="container">
  <h1>🐟 Precificador de Piscicultura</h1>
  <p>O sistema foi reinicializado com sucesso. Se você chegou até aqui, o arquivo base está rodando perfeitamente no seu navegador!</p>
  <button class="btn" onclick="carregarSistema()">Carregar Ferramenta Completa</button>
</div>

<script>
function carregarSistema() {
  alert("Sistema pronto para receber os dados!");
}
</script>
</body>
</html>
