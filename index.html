<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precificador de Piscicultura — Versão Zootécnica e Ambiental</title>
<style>
:root{--bg:#f4f8fa;--surface:#ffffff;--ink:#12303b;--ink2:#5b7784;--line:#dde7ec;--accent:#0e7490;--accent2:#0f9ba8;--green:#15803d;--orange:#b45309;--purple:#7e22ce;--red:#b91c1c;--blue:#1d4ed8}
@media (prefers-color-scheme:dark){:root{--bg:#0d1b20;--surface:#162a31;--ink:#e5f1f5;--ink2:#9db4bd;--line:#26414b;--accent:#22b8cf;--accent2:#2dd4bf}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-size:1.6rem}
.brand-title{font-weight:800;font-size:1.05rem;line-height:1.2}
.brand-sub{font-size:.75rem;color:var(--ink2);margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-reset{background:transparent;border:1px solid var(--line);color:var(--ink2);padding:8px 12px;border-radius:8px;font-size:.8rem;cursor:pointer;min-height:40px}
.btn-reset:hover{border-color:var(--accent);color:var(--accent)}
.save-badge{font-size:.72rem;color:var(--ink2);white-space:nowrap}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:8px 14px;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;min-height:40px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.content{max-width:1180px;margin:0 auto;padding:22px 16px}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-size:1.3rem;margin:0 0 6px}
h3{font-size:1rem;margin:22px 0 8px;color:var(--accent)}
.hint{font-size:.82rem;color:var(--ink2);margin:0 0 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
label{display:block;font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:6px}
input.inp,select.inp{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:.9rem;background:var(--surface);color:var(--ink);min-height:40px}
input.inp:focus,select.inp:focus{outline:2px solid var(--accent2);border-color:var(--accent2)}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0}
.tbl th{background:rgba(14,116,144,.08);text-align:left;padding:9px 8px;font-size:.76rem;letter-spacing:.02em;color:var(--ink2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:rgba(14,116,144,.04)}
.tbl td.calc{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.subtotal{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:.86rem;margin:10px 0}
.info,.infobox{background:rgba(14,116,144,.07);border-left:3px solid var(--accent);padding:10px 12px;border-radius:6px;font-size:.86rem;margin:8px 0}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700}
.badge.green{background:rgba(21,128,61,.12);color:var(--green)}
.badge.orange{background:rgba(180,83,9,.12);color:var(--orange)}
.badge.red{background:rgba(185,28,28,.12);color:var(--red)}
.badge.blue{background:rgba(29,78,216,.12);color:var(--blue)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.card-ind{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(2,23,32,.04)}
.card-ind .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);font-weight:700}
.card-ind .val{font-size:1.25rem;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.card-ind .sub{font-size:.76rem;color:var(--ink2);margin-top:3px}
.val.blue{color:var(--blue)}.val.green{color:var(--green)}.val.orange{color:var(--orange)}.val.purple{color:var(--purple)}.val.red{color:var(--red)}
.foot{max-width:1180px;margin:26px auto 0;padding:14px 16px;font-size:.72rem;color:var(--ink2);border-top:1px solid var(--line)}
.chart-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0}
.chart-box h4{margin:0 0 10px;font-size:.92rem;color:var(--accent)}
input.inp, select.inp { color: var(--ink) !important; background-color: var(--surface) !important; }
option { background-color: var(--surface); color: var(--ink); }
</style>

<body>
<div id="root"></div>

<script>
"use strict";
const defValue = v => (v === "" || v === null || v === undefined ? 0 : Number(v));
const seguranca = x => (typeof x === "number" && isFinite(x) && !isNaN(x) ? x : 0);
const fmt = (v, d = 2) => {
  if (v === null || v === undefined || isNaN(v) || !isFinite(v)) return "—";
  return v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
};
const fmtMoeda = v => {
  if (v === null || v === undefined || isNaN(v) || !isFinite(v)) return "—";
  return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
};

function computeAll(S) {
  const q = S.quantitativos, p = S.percentuais, cul = S.cultivo;
  const periodoCultivo = cul.dataEstocagem && cul.dataDespesca
    ? Math.round((new Date(cul.dataDespesca) - new Date(cul.dataEstocagem)) / 86400000) : 0;

  const totalMaquinas = S.maquinas.reduce((s, i) => s + defValue(i.qtd) * defValue(i.preco), 0);
  const totalMateriais = S.materiais.reduce((s, i) => s + defValue(i.qtd) * defValue(i.preco), 0) + defValue(S.maoDeObraConstrucao);
  const valorEquipamentos = S.equipamentos.reduce((s, i) => s + defValue(i.qtd) * defValue(i.preco), 0);
  const deprecEquip = S.equipamentos.reduce((s, i) =>
    s + (defValue(i.vidaUtil) > 0 ? (defValue(i.qtd) * defValue(i.preco)) / defValue(i.vidaUtil) : 0), 0);

  const alevinosTotalQtd = defValue(q.alevinosQtd);
  const alevinosPrecoMedio = alevinosTotalQtd > 0 ? (alevinosTotalQtd * defValue(q.alevinosPrecoUnit)) / alevinosTotalQtd : 0;
  const producaoTotalKg = S.especies.reduce((s, e) => s + defValue(e.qtd), 0);
  const receitaPescado = S.especies.reduce((s, e) => s + defValue(e.qtd) * defValue(e.precoUnit), 0);
  const receitaBruta = receitaPescado + defValue(S.outrasReceitas);
  const precoMedioVenda = producaoTotalKg > 0 ? receitaPescado / producaoTotalKg : 0;
  const pesoMedioFinalGlobal = producaoTotalKg > 0
    ? (S.especies.reduce((s, e) => s + defValue(e.qtd) * defValue(e.pesoMedioFinal), 0) / producaoTotalKg) : 0;
  const biomassaInicial = (defValue(q.alevinosPesoMedio) * alevinosTotalQtd) / 1000;

  const depConstrucao = defValue(S.vidaUtilConstrucao) > 0 ? (totalMaquinas / defValue(S.vidaUtilConstrucao)) * 0.9 : 0;
  const depAbastecimento = defValue(S.vidaUtilConstrucao) > 0 ? (totalMateriais / defValue(S.vidaUtilConstrucao)) * 0.9 : 0;
  const custoTotalViveiro = totalMaquinas + totalMateriais + valorEquipamentos;
  const depreciacaoAnualTotal = depConstrucao + depAbastecimento + deprecEquip;

  const coeItens = [
    { nome: "Alevinos", valor: alevinosTotalQtd * alevinosPrecoMedio },
    { nome: "Mão de obra + encargos", valor: defValue(q.maoDeObraCultivoHoras) * defValue(q.maoDeObraCultivoValor) },
    { nome: "Alimentação/ração", valor: defValue(q.racao1Qtd) * defValue(q.racao1Preco) + defValue(q.racao2Qtd) * defValue(q.racao2Preco) },
    { nome: "Fertilizantes orgânicos", valor: defValue(q.fertOrg1Qtd) * defValue(q.fertOrg1Preco) + defValue(q.fertOrg2Qtd) * defValue(q.fertOrg2Preco) },
    { nome: "Fertilizantes químicos", valor: defValue(q.fertQuim1Qtd) * defValue(q.fertQuim1Preco) + defValue(q.fertQuim2Qtd) * defValue(q.fertQuim2Preco) },
    { nome: "Calagem", valor: defValue(q.calcarioQtd) * defValue(q.calcarioPreco) + defValue(q.calVirgemQtd) * defValue(q.calVirgemPreco) },
    { nome: "Combustível", valor: defValue(q.combustivelQtd) * defValue(q.combustivelPreco) },
    { nome: "Energia elétrica", valor: defValue(q.energiaQtd) * defValue(q.energiaPreco) },
    { nome: "Análise da água", valor: defValue(q.analiseAguaQtd) * defValue(q.analiseAguaPreco) },
    { nome: "Transporte", valor: defValue(q.transporteQtd) * defValue(q.transportePreco) },
    { nome: "Assistência técnica", valor: defValue(q.assistenciaQtd) * defValue(q.assistenciaPreco) },
    { nome: "Gastos administrativos e financeiros", valor: defValue(q.gastosAdm) },
    { nome: "Medicamentos e produtos químicos", valor: defValue(q.medicamentos) },
    { nome: "Outros custos operacionais", valor: defValue(q.outrosOperacionais) },
    { nome: "Manutenção", valor: defValue(S.manutencaoConstrucao) + defValue(S.manutencaoEquipamentos) },
    { nome: "Arrendamento", valor: defValue(q.arrendamento) }
  ];
  const coeTotal = coeItens.reduce((s, i) => s + i.valor, 0);
  const cotTotal = coeTotal + defValue(q.proLaboreSalario) + depreciacaoAnualTotal;
  const jurosCapital = (defValue(p.jurosCapital) / 100) * custoTotalViveiro;
  const jurosTerra = defValue(q.precoTerra) * defValue(q.terraHa) * defValue(p.jurosTerra) / 100;
  const custoTotal = cotTotal + jurosCapital + jurosTerra;

  const racaoQtdTotal = defValue(q.racao1Qtd) + defValue(q.racao2Qtd);
  const ind = {
    periodoCultivo, areaViveiro: defValue(cul.areaViveiro),
    quantidadePeixes: seguranca(producaoTotalKg / pesoMedioFinalGlobal),
    densidade: seguranca(alevinosTotalQtd / (defValue(cul.areaViveiro) * 10000)),
    sobrevivencia: seguranca(((producaoTotalKg * 1000 / pesoMedioFinalGlobal) * 100) / alevinosTotalQtd),
    taxaCrescimento: seguranca((pesoMedioFinalGlobal - defValue(q.alevinosPesoMedio)) / periodoCultivo),
    produtividade: seguranca(producaoTotalKg * 365 / (defValue(cul.areaViveiro) * periodoCultivo)),
    conversaoAlimentar: seguranca(racaoQtdTotal / (producaoTotalKg - biomassaInicial)),
    rb: receitaBruta, rbKg: seguranca(receitaBruta / producaoTotalKg),
    coe: coeTotal, coeKg: seguranca(coeTotal / producaoTotalKg),
    cot: cotTotal, cotKg: seguranca(cotTotal / producaoTotalKg),
    ct: custoTotal, ctKg: seguranca(custoTotal / producaoTotalKg),
    mbu: seguranca((receitaBruta - coeTotal) / producaoTotalKg), mb: seguranca(((receitaBruta - coeTotal) / receitaBruta) * 100),
    mlu: seguranca((receitaBruta - cotTotal) / producaoTotalKg), ml: seguranca(((receitaBruta - cotTotal) / receitaBruta) * 100)
  };

  const biometriasProc = [];
  let pesoAnterior = defValue(q.alevinosPesoMedio);
  let dataAnterior = cul.dataEstocagem ? new Date(cul.dataEstocagem) : null;
  let biomassaAnterior = biomassaInicial;
  
  S.biometrias.forEach((b, idx) => {
    if (!b.data || b.pesoMedio === "" || Number(b.pesoMedio) <= 0) return;
    const dataAtual = new Date(b.data);
    const diasTotal = dataAnterior ? Math.round((dataAtual - new Date(cul.dataEstocagem)) / 86400000) : 0;
    const diasIntervalo = dataAnterior ? Math.round((dataAtual - dataAnterior) / 86400000) : diasTotal;
    const pesoAtual = Number(b.pesoMedio);
    const ganhoDiario = diasIntervalo > 0 ? (pesoAtual - pesoAnterior) / diasIntervalo : 0;
    const biomassaEstimada = (alevinosTotalQtd * pesoAtual) / 1000;
    const ganhoBiomassaDiario = diasIntervalo > 0 ? (biomassaEstimada - biomassaAnterior) / diasIntervalo : 0;
    const tce = (pesoAnterior > 0 && diasIntervalo > 0) ? (Math.log(pesoAtual) - Math.log(pesoAnterior)) / diasIntervalo * 100 : 0;

    biometriasProc.push({
      idx: idx + 1, data: b.data, diasTotal, diasIntervalo, peso: pesoAtual,
      ganhoDiario, biomassaEstimada, ganhoBiomassaDiario, tce
    });
    pesoAnterior = pesoAtual;
    dataAnterior = dataAtual;
    biomassaAnterior = biomassaEstimada;
  });

  return { S, D: { periodoCultivo, totalMaquinas, totalMateriais, valorEquipamentos, deprecEquip, alevinosTotalQtd, alevinosPrecoMedio, producaoTotalKg, receitaBruta, receitaPescado, precoMedioVenda, pesoMedioFinalGlobal, biomassaInicial, depConstrucao, depAbastecimento, custoTotalViveiro, depreciacaoAnualTotal, coeItens, coeTotal, cotTotal, custoTotal, ind, biometriasProc } };
}

function avaliarParametroAgua(parametro, valorNum) {
  if (isNaN(valorNum)) return { status: "normal", texto: "Não avaliado" };
  const p = parametro.toLowerCase();
  if (p.includes("oxigênio")) {
    if (valorNum < 3) return { status: "red", texto: "Crítico (< 3 mg/L)" };
    if (valorNum < 5) return { status: "orange", texto: "Alerta (< 5 mg/L)" };
    return { status: "green", texto: "Ideal (≥ 5 mg/L)" };
  }
  if (p.includes("ph")) {
    if (valorNum < 6 || valorNum > 9) return { status: "red", texto: "Crítico (Fora de 6-9)" };
    if (valorNum < 6.5 || valorNum > 8.5) return { status: "orange", texto: "Alerta (Ideal 6.5-8.5)" };
    return { status: "green", texto: "Ideal (6.5-8.5)" };
  }
  if (p.includes("temperatura")) {
    if (valorNum < 20 || valorNum > 34) return { status: "red", texto: "Crítico" };
    if (valorNum < 24 || valorNum > 32) return { status: "orange", texto: "Alerta (Ideal 24-32°C)" };
    return { status: "green", texto: "Ideal (24-32°C)" };
  }
  if (p.includes("amônia") || p.includes("nitrito")) {
    if (valorNum > 0.5) return { status: "red", texto: "Tóxico (> 0.5 mg/L)" };
    if (valorNum > 0.1) return { status: "orange", texto: "Atenção (> 0.1 mg/L)" };
    return { status: "green", texto: "Seguro (< 0.1 mg/L)" };
  }
  return { status: "green", texto: "Registrado" };
}

function hojeISO() {
  const d = new Date(); const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
}

function defaultState() {
  return {
    tab: "geral",
    cultivo: { produtor: "", localidade: "", municipio: "", numeroViveiro: "", areaViveiro: 0, numeroCultivo: "", dataEstocagem: "", dataDespesca: "", elaborador: "" },
    especies: [
      { nome: "Tambaqui", pesoMedioFinal: 1500, qtd: 0, precoUnit: 0 },
      { nome: "Tilápia", pesoMedioFinal: 800, qtd: 0, precoUnit: 0 }
    ],
    outrasReceitas: 0, dolar: 5.5,
    percentuais: { jurosCapital: 0, jurosTerra: 0 },
    quantitativos: {
      terraHa: 0, precoTerra: 0, alevinosQtd: 0, alevinosPesoMedio: 0, alevinosPrecoUnit: 0,
      maoDeObraCultivoHoras: 0, maoDeObraCultivoValor: 0,
      racao1Qtd: 0, racao1Preco: 0, racao2Qtd: 0, racao2Preco: 0,
      fertOrg1Qtd: 0, fertOrg1Preco: 0, fertOrg2Qtd: 0, fertOrg2Preco: 0,
      fertQuim1Qtd: 0, fertQuim1Preco: 0, fertQuim2Qtd: 0, fertQuim2Preco: 0,
      calcarioQtd: 0, calcarioPreco: 0, calVirgemQtd: 0, calVirgemPreco: 0,
      combustivelQtd: 0, combustivelPreco: 0, energiaQtd: 0, energiaPreco: 0,
      analiseAguaQtd: 0, analiseAguaPreco: 0, transporteQtd: 0, transportePreco: 0,
      assistenciaQtd: 0, assistenciaPreco: 0, proLaboreSalario: 0,
      gastosAdm: 0, medicamentos: 0, outrosOperacionais: 0, arrendamento: 0
    },
    maquinas: [
      { id: 1, nome: "Trator de esteira", unidade: "h", qtd: 0, preco: 0 },
      { id: 2, nome: "Retroescavadeira", unidade: "h", qtd: 0, preco: 0 }
    ],
    vidaUtilConstrucao: 10,
    materiais: [
      { id: 1, nome: "Tubos PVC", unidade: "m", qtd: 0, preco: 0 }
    ],
    maoDeObraConstrucao: 0, manutencaoConstrucao: 0,
    equipamentos: [
      { id: 1, nome: "Aerador de pás", unidade: "Unidade", qtd: 0, preco: 0, vidaUtil: 5 }
    ],
    manutencaoEquipamentos: 0,
    biometrias: Array.from({ length: 8 }, () => ({ data: "", pesoMedio: "" })),
    analises: [
      { parametro: "Oxigênio (mg/L)", data: "", resultado: "" },
      { parametro: "pH", data: "", resultado: "" },
      { parametro: "Temperatura (°C)", data: "", resultado: "" },
      { parametro: "Amônia total (mg/L)", data: "", resultado: "" },
      { parametro: "Nitrito (mg/L)", data: "", resultado: "" },
      { parametro: "Transparência (cm)", data: "", resultado: "" }
    ],
    margemMarkup: 30, markupModalidade: "cot"
  };
}

const STORAGE_KEY = "precipisc_v2";
let saveStatus = "";
let S = defaultState();

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
    saveStatus = "Salvo automaticamente às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    updateSaveBadge();
  } catch (e) { saveStatus = "Armazenamento desativado"; }
}
function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function updateSaveBadge() {
  const b = document.getElementById("save-badge");
  if (b) b.textContent = saveStatus;
}
function deepMerge(base, over) {
  if (Array.isArray(over)) {
    const out = Array.isArray(base) ? base.slice() : [];
    over.forEach((v, i) => { out[i] = deepMerge(out[i], v); });
    return out;
  }
  if (over !== null && typeof over === "object") {
    const out = base !== null && typeof base === "object" ? { ...base } : {};
    Object.keys(over).forEach(k => { out[k] = deepMerge(out[k], over[k]); });
    return out;
  }
  return over === undefined ? base : over;
}

const TABS = [
  { id: "geral", label: "① Dados gerais" },
  { id: "levantamento", label: "② Levantamento" },
  { id: "implantacao", label: "③ Custo de implantação" },
  { id: "operacional", label: "④ Custos operacionais" },
  { id: "indicadores", label: "⑤ Indicadores" },
  { id: "precificacao", label: "⑥ Precificação" },
  { id: "biometrias", label: "⑦ Biometrias (Técnico)" },
  { id: "analises", label: "⑧ Qualidade da Água (Técnico)" }
];

document.addEventListener("input", onFieldChange, true);
document.addEventListener("change", onFieldChange, true);
document.addEventListener("click", function (ev) {
  const btn = ev.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.getAttribute("data-action");
  if (action.indexOf("tab:") === 0) { switchTab(action.slice(4)); return; }
  if (action === "reset") { if (confirm("Limpar dados?")) { localStorage.removeItem(STORAGE_KEY); window.location.reload(); } return; }
  if (action === "export") {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "piscicultura-dados.json";
    a.click(); URL.revokeObjectURL(url);
    return;
  }
  if (action === "import") {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json";
    inp.onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      const fr = new FileReader();
      fr.onload = ev2 => {
        try { S = deepMerge(defaultState(), JSON.parse(ev2.result)); persist(); render(); alert("Dados carregados!"); } catch (err) { alert("Arquivo inválido."); }
      };
      fr.readAsText(f);
    };
    inp.click();
    return;
  }
});

function switchTab(id) { S.tab = id; persist(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function onFieldChange(ev) {
  const el = ev.target.closest("[data-path]");
  if (!el) return;
  const p = el.getAttribute("data-path");
  let v = el.value;
  if (el.getAttribute("data-num") === "1") {
    v = v === "" || v === "-" ? 0 : Number(v.replace(",", "."));
    if (isNaN(v)) v = 0;
  }
  setPath(S, p, v);
  persist();
  updateLive();
}
function setPath(obj, path, val) {
  const parts = String(path).split(".");
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) { cur = cur[parts[i]]; }
  cur[parts[parts.length - 1]] = val;
}

function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">"); }
function escAttr(s) { return String(s == null ? "" : s).replace(/&/g, "&").replace(/"/g, """); }
function inputNum(val, path) { return '<input type="number" min="0" step="any" class="inp num" data-path="' + escAttr(path) + '" data-num="1" value="' + (Number(val) || 0) + '">'; }
function inputTxt(val, path) { return '<input type="text" class="inp" data-path="' + escAttr(path) + '" value="' + escAttr(val) + '">'; }
function inputDate(val, path) { return '<input type="date" class="inp" data-path="' + escAttr(path) + '" value="' + escAttr(val || "") + '">'; }
function selectHTML(val, path, opts) { return '<select class="inp" data-path="' + escAttr(path) + '">' + opts.map(o => '<option value="' + escAttr(o.v) + '"' + (String(val) === String(o.v) ? " selected" : "") + '>' + esc(o.l) + '</option>').join("") + '</select>'; }
function outSpan(key) { return '<span data-out="' + escAttr(key) + '">—</span>'; }

function updateLive() {
  const { D } = computeAll(S);
  document.querySelectorAll("[data-out]").forEach(el => {
    const k = el.getAttribute("data-out");
    if (k === "periodo") el.textContent = fmt(D.periodoCultivo, 0) + " dias";
    if (k === "producao-total") el.textContent = fmt(D.producaoTotalKg, 0) + " kg";
    if (k === "receita-bruta") el.textContent = fmtMoeda(D.receitaBruta);
    if (k === "preco-medio-venda") el.textContent = fmtMoeda(D.precoMedioVenda) + "/kg";
  });
}

function render() {
  const root = document.getElementById("root");
  if (!root) return;
  let html = topbarHTML() + tabsBarHTML() + '<main class="content">';
  switch (S.tab) {
    case "geral": html += tabGeralHTML(); break;
    case "levantamento": html += tabLevantamentoHTML(); break;
    case "implantacao": html += tabImplantacaoHTML(); break;
    case "operacional": html += tabOperacionalHTML(); break;
    case "indicadores": html += tabIndicadoresHTML(); break;
    case "precificacao": html += tabPrecificacaoHTML(); break;
    case "biometrias": html += tabBiometriasHTML(); break;
    case "analises": html += tabAnalisesHTML(); break;
  }
  html += "</main>" + footerHTML();
  root.innerHTML = html;
  updateLive();
}

function topbarHTML() {
  return '<header class="topbar">' +
    '<div class="brand"><span class="logo">🐟</span><div><div class="brand-title">Precificador de Piscicultura</div><div class="brand-sub">Módulo Zootécnico & Ambiental Integrado</div></div></div>' +
    '<div class="toolbar"><span class="save-badge" id="save-badge"></span>' +
    '<button class="btn-reset" data-action="export">💾 Salvar</button>' +
    '<button class="btn-reset" data-action="import">📂 Carregar</button>' +
    '<button class="btn-reset" data-action="reset">↺ Reiniciar</button></div>' +
  '</header>';
}
function tabsBarHTML() { return '<nav class="tabs">' + TABS.map(t => '<button class="tab ' + (S.tab === t.id ? "active" : "") + '" data-action="tab:' + t.id + '">' + t.label + '</button>').join("") + '</nav>'; }
function footerHTML() { return '<footer class="foot">Integração zootécnica e econômica avançada.</footer>'; }

function tabGeralHTML() {
  return '<section class="fade"><h2>Dados gerais do cultivo</h2><div class="grid2">' +
    '<label>Produtor<br>' + inputTxt(S.cultivo.produtor, "cultivo.produtor") + '</label>' +
    '<label>Município<br>' + inputTxt(S.cultivo.municipio, "cultivo.municipio") + '</label>' +
    '<label>Área do viveiro (ha)<br>' + inputNum(S.cultivo.areaViveiro, "cultivo.areaViveiro") + '</label>' +
    '<label>Data de estocagem<br>' + inputDate(S.cultivo.dataEstocagem, "cultivo.dataEstocagem") + '</label>' +
    '<label>Data da despesca (ou previsão)<br>' + inputDate(S.cultivo.dataDespesca, "cultivo.dataDespesca") + '</label>' +
    '<div class="infobox">Período de cultivo: <b>' + outSpan("periodo") + '</b></div>' +
    '</div><h3>Espécies</h3>' +
    '<table class="tbl"><thead><tr><th>Espécie</th><th>Peso final (g)</th><th>Qtd (kg)</th><th>Preço (R$/kg)</th></tr></thead><tbody>' +
    S.especies.map((e, i) => '<tr><td>' + inputTxt(e.nome, "especies." + i + ".nome") + '</td><td>' + inputNum(e.pesoMedioFinal, "especies." + i + ".pesoMedioFinal") + '</td><td>' + inputNum(e.qtd, "especies." + i + ".qtd") + '</td><td>' + inputNum(e.precoUnit, "especies." + i + ".precoUnit") + '</td></tr>').join("") +
    '</tbody></table></section>';
}

function tabLevantamentoHTML() {
  return '<section class="fade"><h2>Levantamento de Insumos</h2><div class="grid2">' +
    '<label>Quantidade de alevinos (unid)<br>' + inputNum(S.quantitativos.alevinosQtd, "quantitativos.alevinosQtd") + '</label>' +
    '<label>Peso médio inicial (g)<br>' + inputNum(S.quantitativos.alevinosPesoMedio, "quantitativos.alevinosPesoMedio") + '</label>' +
    '<label>Preço unitário alevino (R$)<br>' + inputNum(S.quantitativos.alevinosPrecoUnit, "quantitativos.alevinosPrecoUnit") + '</label>' +
    '<label>Ração total 1 (kg)<br>' + inputNum(S.quantitativos.racao1Qtd, "quantitativos.racao1Qtd") + '</label>' +
    '<label>Preço ração 1 (R$/kg)<br>' + inputNum(S.quantitativos.racao1Preco, "quantitativos.racao1Preco") + '</label>' +
    '</div></section>';
}

function tabImplantacaoHTML() {
  const { D } = computeAll(S);
  return '<section class="fade"><h2>Custo de Implantação</h2><p class="hint">Investimento em infraestrutura.</p>' +
    '<p>Custo total da infraestrutura: <b>' + fmtMoeda(D.custoTotalViveiro) + '</b></p></section>';
}

function tabOperacionalHTML() {
  const { D } = computeAll(S);
  return '<section class="fade"><h2>Custos Operacionais</h2>' +
    '<p>COE Total: <b>' + fmtMoeda(D.coeTotal) + '</b> | COT Total: <b>' + fmtMoeda(D.cotTotal) + '</b></p></section>';
}

function tabIndicadoresHTML() {
  const { D } = computeAll(S); const ind = D.ind;
  return '<section class="fade"><h2>Indicadores Zootécnicos e Econômicos</h2><div class="cards">' +
    '<div class="card-ind"><div class="lbl">Sobrevivência Estimada</div><div class="val blue">' + fmt(ind.sobrevivencia, 1) + '%</div></div>' +
    '<div class="card-ind"><div class="lbl">Taxa Crescimento</div><div class="val green">' + fmt(ind.taxaCrescimento, 2) + ' g/dia</div></div>' +
    '<div class="card-ind"><div class="lbl">Produtividade</div><div class="val orange">' + fmt(ind.produtividade, 0) + ' kg/ha/ano</div></div>' +
    '<div class="card-ind"><div class="lbl">Conversão Alimentar</div><div class="val purple">' + fmt(ind.conversaoAlimentar, 2) + '</div></div>' +
    '</div></section>';
}

function tabPrecificacaoHTML() {
  const { D } = computeAll(S);
  const base = D.ind[S.markupModalidade === "cot" ? "cotKg" : "ctKg"];
  const sugerido = base > 0 ? base * (1 + S.margemMarkup / 100) : 0;
  return '<section class="fade"><h2>Precificação</h2><div class="grid2">' +
    '<label>Base ' + selectHTML(S.markupModalidade, "markupModalidade", [{ v: "cot", l: "COT/kg" }, { v: "ct", l: "CT/kg" }]) + '</label>' +
    '<label>Markup desejado (%) ' + inputNum(S.margemMarkup, "margemMarkup") + '</label>' +
    '</div><div class="cards"><div class="card-ind"><div class="lbl">Preço Sugerido</div><div class="val green">' + fmtMoeda(sugerido) + '/kg</div></div></div></section>';
}

function tabBiometriasHTML() {
  const { D } = computeAll(S);
  const procs = D.biometriasProc;

  let svgChart = '';
  if (procs.length > 0) {
    const maxPeso = Math.max(...procs.map(p => p.peso), 100);
    const width = 600, height = 200, pad = 40;
    const pts = procs.map((p, i) => {
      const x = pad + (i / Math.max(procs.length - 1, 1)) * (width - 2 * pad);
      const y = height - pad - (p.peso / maxPeso) * (height - 2 * pad);
      return { x, y, ...p };
    });
    svgChart = '<div class="chart-box"><h4>Gráfico de Evolução do Peso dos Peixes (g)</h4>' +
      '<svg viewBox="0 0 ' + width + ' ' + height + '" style="width:100%;height:auto">' +
      '<line x1="' + pad + '" y1="' + (height - pad) + '" x2="' + (width - pad) + '" y2="' + (height - pad) + '" stroke="currentColor" stroke-opacity="0.3"/>' +
      '<line x1="' + pad + '" y1="' + pad + '" x2="' + pad + '" y2="' + (height - pad) + '" stroke="currentColor" stroke-opacity="0.3"/>' +
      '<polyline fill="none" stroke="var(--accent)" stroke-width="3" points="' + pts.map(pt => pt.x + ',' + pt.y).join(' ') + '"/>' +
      pts.map(pt => '<circle cx="' + pt.x + '" cy="' + pt.y + '" r="4" fill="var(--accent2)"/><text x="' + pt.x + '" y="' + (height - 15) + '" font-size="10" fill="currentColor" text-anchor="middle">Dia ' + pt.diasTotal + '</text>').join('') +
      '</svg></div>';
  }

  return '<section class="fade"><h2>Acompanhamento Técnico: Biometrias</h2>' +
    '<p class="hint">Insira as datas das pesagens e o peso médio amostrado. O sistema calcula automaticamente o ganho diário, biomassa e TCE.</p>' +
    '<table class="tbl"><thead><tr><th>#</th><th>Data</th><th>Peso Médio (g)</th><th>Dias Cultivo</th><th>Ganho Diário (g/dia)</th><th>Biomassa Est. (kg)</th><th>TCE (%/dia)</th></tr></thead><tbody>' +
    S.biometrias.map((b, i) => {
      const proc = procs.find(p => p.idx === i + 1) || {};
      return '<tr>' +
        '<td>' + (i + 1) + '</td>' +
        '<td>' + inputDate(b.data, "biometrias." + i + ".data") + '</td>' +
        '<td>' + inputNum(b.pesoMedio, "biometrias." + i + ".pesoMedio") + '</td>' +
        '<td class="calc">' + (proc.diasTotal !== undefined ? proc.diasTotal + " d" : "—") + '</td>' +
        '<td class="calc">' + (proc.ganhoDiario !== undefined ? fmt(proc.ganhoDiario, 2) + " g" : "—") + '</td>' +
        '<td class="calc">' + (proc.biomassaEstimada !== undefined ? fmt(proc.biomassaEstimada, 1) + " kg" : "—") + '</td>' +
        '<td class="calc">' + (proc.tce !== undefined ? fmt(proc.tce, 2) + "%" : "—") + '</td>' +
      '</tr>';
    }).join("") +
    '</tbody></table>' + svgChart + '</section>';
}

function tabAnalisesHTML() {
  const { D } = computeAll(S);
  let alertasIntegrados = [];
  if (S.analises && S.biometriasProc) {
    S.analises.forEach(a => {
      if (!a.data || !a.resultado) return;
      const valNum = Number(a.resultado.replace(",", "."));
      const aval = avaliarParametroAgua(a.parametro, valNum);
      if (aval.status === "red" || aval.status === "orange") {
        const dataAnalise = new Date(a.data);
        D.biometriasProc.forEach(b => {
          if (!b.data) return;
          const dataBio = new Date(b.data);
          const diffDias = Math.round((dataBio - dataAnalise) / 86400000);
          if (diffDias >= 0 && diffDias <= 15 && b.ganhoDiario < 1.0) {
            alertasIntegrados.push('Em <b>' + a.data + '</b> o parâmetro <b>' + a.parametro + '</b> apresentou valor crítico (<b>' + a.resultado + '</b>). Houve registro de biometria próxima (Dia ' + b.diasTotal + ') com ganho reduzido (<b>' + fmt(b.ganhoDiario, 2) + ' g/dia</b>).');
          }
        });
      }
    });
  }

  return '<section class="fade"><h2>Acompanhamento Ambiental: Qualidade da Água</h2>' +
    '<p class="hint">Monitore os parâmetros físico-químicos com classificação automática de risco e alerta técnico integrado.</p>' +
    (alertasIntegrados.length > 0 ? '<div class="infobox" style="border-left-color:var(--orange)"><b>⚠️ Associação Temporal Detectada:</b><ul>' + alertasIntegrados.map(al => '<li>' + al + '</li>').join('') + '</ul></div>' : '') +
    '<table class="tbl"><thead><tr><th>Parâmetro</th><th>Data</th><th>Resultado</th><th>Classificação Automática</th></tr></thead><tbody>' +
    S.analises.map((a, i) => {
      const valNum = Number(String(a.resultado).replace(",", "."));
      const aval = avaliarParametroAgua(a.parametro, valNum);
      return '<tr>' +
        '<td>' + esc(a.parametro) + '</td>' +
        '<td>' + inputDate(a.data, "analises." + i + ".data") + '</td>' +
        '<td>' + inputTxt(a.resultado, "analises." + i + ".resultado") + '</td>' +
        '<td><span class="badge ' + aval.status + '">' + aval.texto + '</span></td>' +
      '</tr>';
    }).join("") +
    '</tbody></table></section>';
}

function boot() {
  const saved = loadState();
  if (saved) S = deepMerge(defaultState(), saved);
  render();
}
boot();
</script>
</body>
</html>
