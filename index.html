<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precificador de Piscicultura</title>
<style>
:root{--bg:#f4f8fa;--surface:#ffffff;--ink:#12303b;--ink2:#5b7784;--line:#dde7ec;--accent:#0e7490;--accent2:#0f9ba8;--green:#15803d;--orange:#b45309;--purple:#7e22ce;--red:#b91c1c;--blue:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding-bottom:40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-size:1.6rem}
.brand-title{font-weight:800;font-size:1.05rem}
.brand-sub{font-size:.75rem;color:var(--ink2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-reset{background:transparent;border:1px solid var(--line);color:var(--ink2);padding:8px 12px;border-radius:8px;font-size:.8rem;cursor:pointer}
.btn-reset:hover{border-color:var(--accent);color:var(--accent)}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:8px 14px;font-size:.82rem;font-weight:600;cursor:pointer}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.content{max-width:1180px;margin:0 auto;padding:22px 16px}
h2{font-size:1.3rem;margin:0 0 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
label{display:block;font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:6px}
input.inp,select.inp{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:.9rem;background:var(--surface);color:var(--ink)}
input.num{text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0}
.tbl th{background:rgba(14,116,144,.08);text-align:left;padding:9px 8px;font-size:.76rem;color:var(--ink2);border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700}
.badge.green{background:rgba(21,128,61,.12);color:var(--green)}
.badge.orange{background:rgba(180,83,9,.12);color:var(--orange)}
.badge.red{background:rgba(185,28,28,.12);color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.card-ind{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card-ind .lbl{font-size:.74rem;text-transform:uppercase;color:var(--ink2);font-weight:700}
.card-ind .val{font-size:1.25rem;font-weight:800;margin-top:6px}
.foot{max-width:1180px;margin:26px auto 0;padding:14px 16px;font-size:.72rem;color:var(--ink2);border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";
const defValue = v => (v === "" || v === null || v === undefined ? 0 : Number(v));
const fmt = (v, d = 2) => (v === null || v === undefined || isNaN(v) || !isFinite(v)) ? "—" : v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtMoeda = v => (v === null || v === undefined || isNaN(v) || !isFinite(v)) ? "—" : v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

function computeAll(S) {
  const q = S.quantitativos, cul = S.cultivo;
  const periodoCultivo = cul.dataEstocagem && cul.dataDespesca ? Math.round((new Date(cul.dataDespesca) - new Date(cul.dataEstocagem)) / 86400000) : 0;
  const producaoTotalKg = S.especies.reduce((s, e) => s + defValue(e.qtd), 0);
  const receitaPescado = S.especies.reduce((s, e) => s + defValue(e.qtd) * defValue(e.precoUnit), 0);
  
  const biometriasProc = [];
  let pesoAnterior = defValue(q.alevinosPesoMedio);
  let dataAnterior = cul.dataEstocagem ? new Date(cul.dataEstocagem) : null;
  let biomassaAnterior = (defValue(q.alevinosPesoMedio) * defValue(q.alevinosQtd)) / 1000;

  S.biometrias.forEach((b, idx) => {
    if (!b.data || b.pesoMedio === "" || Number(b.pesoMedio) <= 0) return;
    const dataAtual = new Date(b.data);
    const diasTotal = dataAnterior ? Math.round((dataAtual - new Date(cul.dataEstocagem)) / 86400000) : 0;
    const diasIntervalo = dataAnterior ? Math.round((dataAtual - dataAnterior) / 86400000) : diasTotal;
    const pesoAtual = Number(b.pesoMedio);
    const ganhoDiario = diasIntervalo > 0 ? (pesoAtual - pesoAnterior) / diasIntervalo : 0;
    const biomassaEstimada = (defValue(q.alevinosQtd) * pesoAtual) / 1000;
    const tce = (pesoAnterior > 0 && diasIntervalo > 0) ? (Math.log(pesoAtual) - Math.log(pesoAnterior)) / diasIntervalo * 100 : 0;

    biometriasProc.push({ idx: idx + 1, data: b.data, diasTotal, peso: pesoAtual, ganhoDiario, biomassaEstimada, tce });
    pesoAnterior = pesoAtual;
    dataAnterior = dataAtual;
    biomassaAnterior = biomassaEstimada;
  });

  return { S, D: { periodoCultivo, producaoTotalKg, receitaBruta: receitaPescado, biometriasProc } };
}

function avaliarParametroAgua(parametro, valorNum) {
  if (isNaN(valorNum)) return { status: "normal", texto: "Não avaliado" };
  const p = parametro.toLowerCase();
  if (p.includes("oxigênio")) {
    if (valorNum < 3) return { status: "red", texto: "Crítico (< 3)" };
    if (valorNum < 5) return { status: "orange", texto: "Alerta (< 5)" };
    return { status: "green", texto: "Ideal" };
  }
  if (p.includes("ph")) {
    if (valorNum < 6 || valorNum > 9) return { status: "red", texto: "Crítico" };
    return { status: "green", texto: "Ideal" };
  }
  return { status: "green", texto: "Registrado" };
}

function defaultState() {
  return {
    tab: "geral",
    cultivo: { produtor: "", municipio: "", dataEstocagem: "", dataDespesca: "" },
    especies: [{ nome: "Tambaqui", pesoMedioFinal: 1500, qtd: 0, precoUnit: 0 }],
    quantitativos: { alevinosQtd: 0, alevinosPesoMedio: 0 },
    biometrias: Array.from({ length: 6 }, () => ({ data: "", pesoMedio: "" })),
    analises: [
      { parametro: "Oxigênio (mg/L)", data: "", resultado: "" },
      { parametro: "pH", data: "", resultado: "" }
    ]
  };
}

const STORAGE_KEY = "precipisc_v3";
let S = defaultState();

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) {}
}

const TABS = [
  { id: "geral", label: "① Dados gerais" },
  { id: "biometrias", label: "⑦ Biometrias" },
  { id: "analises", label: "⑧ Qualidade da Água" }
];

document.addEventListener("input", e => {
  const el = e.target.closest("[data-path]");
  if (!el) return;
  const p = el.getAttribute("data-path");
  let v = el.value;
  if (el.type === "number") v = v === "" ? 0 : Number(v.replace(",", "."));
  
  const parts = p.split(".");
  let cur = S;
  for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  cur[parts[parts.length - 1]] = v;
  
  persist();
  render();
}, true);

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.getAttribute("data-action");
  if (action.startsWith("tab:")) {
    S.tab = action.slice(4);
    render();
  }
});

function render() {
  const root = document.getElementById("root");
  if (!root) return;
  
  const tabsNav = '<nav class="tabs">' + TABS.map(t => '<button class="tab ' + (S.tab === t.id ? "active" : "") + '" data-action="tab:' + t.id + '">' + t.label + '</button>').join("") + '</nav>';
  
  let content = '';
  if (S.tab === "geral") {
    content = '<h2>Dados Gerais</h2><div class="grid2">' +
      '<label>Produtor<br><input type="text" class="inp" data-path="cultivo.produtor" value="' + (S.cultivo.produtor || "") + '"></label>' +
      '<label>Município<br><input type="text" class="inp" data-path="cultivo.municipio" value="' + (S.cultivo.municipio || "") + '"></label>' +
      '<label>Data Estocagem<br><input type="date" class="inp" data-path="cultivo.dataEstocagem" value="' + (S.cultivo.dataEstocagem || "") + '"></label>' +
      '<label>Data Despesca<br><input type="date" class="inp" data-path="cultivo.dataDespesca" value="' + (S.cultivo.dataDespesca || "") + '"></label>' +
      '</div>';
  } else if (S.tab === "biometrias") {
    const { D } = computeAll(S);
    content = '<h2>Biometrias</h2><table class="tbl"><thead><tr><th>#</th><th>Data</th><th>Peso (g)</th><th>Ganho (g/dia)</th><th>Biomassa (kg)</th></tr></thead><tbody>' +
      S.biometrias.map((b, i) => {
        const p = D.biometriasProc.find(x => x.idx === i + 1) || {};
        return '<tr><td>' + (i + 1) + '</td>' +
          '<td><input type="date" class="inp" data-path="biometrias.' + i + '.data" value="' + (b.data || "") + '"></td>' +
          '<td><input type="number" class="inp num" data-path="biometrias.' + i + '.pesoMedio" value="' + (b.pesoMedio || "") + '"></td>' +
          '<td>' + (p.ganhoDiario !== undefined ? fmt(p.ganhoDiario, 2) : "—") + '</td>' +
          '<td>' + (p.biomassaEstimada !== undefined ? fmt(p.biomassaEstimada, 1) : "—") + '</td></tr>';
      }).join("") + '</tbody></table>';
  } else if (S.tab === "analises") {
    content = '<h2>Qualidade da Água</h2><table class="tbl"><thead><tr><th>Parâmetro</th><th>Data</th><th>Resultado</th><th>Status</th></tr></thead><tbody>' +
      S.analises.map((a, i) => {
        const valNum = Number(String(a.resultado).replace(",", "."));
        const aval = avaliarParametroAgua(a.parametro, valNum);
        return '<tr><td>' + a.parametro + '</td>' +
          '<td><input type="date" class="inp" data-path="analises.' + i + '.data" value="' + (a.data || "") + '"></td>' +
          '<td><input type="text" class="inp" data-path="analises.' + i + '.resultado" value="' + (a.resultado || "") + '"></td>' +
          '<td><span class="badge ' + aval.status + '">' + aval.texto + '</span></td></tr>';
      }).join("") + '</tbody></table>';
  }

  root.innerHTML = '<header class="topbar"><div class="brand"><span class="logo">🐟</span><div class="brand-title">Precificador de Piscicultura</div></div></header>' + tabsNav + '<main class="content">' + content + '</main><footer class="foot">Versão Estável</footer>';
}

const saved = localStorage.getItem(STORAGE_KEY);
if (saved) { try { S = JSON.parse(saved); } catch (e) {} }
render();
</script>
</body>
</html>
