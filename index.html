<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precificador de Piscicultura — versão offline</title>
<style>
.app-root{--bg:#f4f8fa;--surface:#ffffff;--ink:#12303b;--ink2:#5b7784;--line:#dde7ec;--accent:#0e7490;--accent2:#0f9ba8;--green:#15803d;--orange:#b45309;--purple:#7e22ce;--red:#b91c1c;--blue:#1d4ed8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:40px}
@media (prefers-color-scheme:dark){.app-root{--bg:#0d1b20;--surface:#162a31;--ink:#e5f1f5;--ink2:#9db4bd;--line:#26414b;--accent:#22b8cf;--accent2:#2dd4bf}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-size:1.6rem}
.brand-title{font-weight:800;font-size:1.05rem;line-height:1.2}
.brand-sub{font-size:.75rem;color:var(--ink2);margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-reset{background:transparent;border:1px solid var(--line);color:var(--ink2);padding:8px 12px;border-radius:8px;font-size:.8rem;cursor:pointer;min-height:40px}
.btn-reset:hover{border-color:var(--accent);color:var(--accent)}
.save-badge{font-size:.72rem;color:var(--ink2);white-space:nowrap}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:8px 14px;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;min-height:40px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.content{max-width:1180px;margin:0 auto;padding:22px 16px}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-size:1.3rem;margin:0 0 6px}
h3{font-size:1rem;margin:22px 0 8px;color:var(--accent)}
.hint{font-size:.82rem;color:var(--ink2);margin:0 0 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
label{display:block;font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:6px}
input.inp,select.inp{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:.9rem;background:var(--surface);color:var(--ink);min-height:40px}
input.inp:focus,select.inp:focus{outline:2px solid var(--accent2);border-color:var(--accent2)}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0}
.tbl th{background:rgba(14,116,144,.08);text-align:left;padding:9px 8px;font-size:.76rem;letter-spacing:.02em;color:var(--ink2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:rgba(14,116,144,.04)}
.tbl td.calc{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.total td{background:rgba(14,116,144,.1);font-weight:800}
.tbl tr.hl td{background:rgba(15,155,168,.12)}
.subtotal{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:.86rem;margin:10px 0}
.info{background:rgba(14,116,144,.07);border-left:3px solid var(--accent);padding:8px 12px;border-radius:6px;font-size:.82rem;margin:10px 0}
.infobox{background:rgba(14,116,144,.07);border-left:3px solid var(--accent);padding:10px 12px;border-radius:6px;font-size:.86rem;margin:8px 0;grid-column:1/-1}
.note{font-size:.76rem;color:var(--ink2);margin-top:14px}
.resumo-linha{display:flex;flex-wrap:wrap;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.88rem;margin-top:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.card-ind{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(2,23,32,.04)}
.card-ind .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);font-weight:700}
.card-ind .val{font-size:1.25rem;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.card-ind .sub{font-size:.76rem;color:var(--ink2);margin-top:3px}
.val.blue{color:var(--blue)}.val.green{color:var(--green)}.val.orange{color:var(--orange)}.val.purple{color:var(--purple)}.val.red{color:var(--red)}
details.orient{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:18px}
details.orient summary{cursor:pointer;font-weight:700;font-size:.86rem;color:var(--accent)}
details.orient ul{margin:8px 0 0;padding-left:18px;font-size:.82rem;color:var(--ink2);line-height:1.6}
.foot{max-width:1180px;margin:26px auto 0;padding:14px 16px;font-size:.72rem;color:var(--ink2);border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(2,23,32,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal-card{background:var(--surface);border-radius:12px;padding:22px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.modal-card h4{margin:0 0 10px;font-size:1rem}
.modal-card p{font-size:.86rem;color:var(--ink2);margin:0 0 16px}
.modal-card button{margin-right:8px}

/* Correção definitiva para texto em branco nos inputs/seletores */
input.inp, select.inp, textarea { color: var(--ink) !important; background-color: var(--surface) !important; }
option { background-color: var(--surface); color: var(--ink); }

@media print{
  *{background:#fff!important;color:#111!important}
  .tabs,.toolbar{display:none!important}
  .app-root{padding:0}
  .content{max-width:none;padding:0 5mm}
  .print-page-break{page-break-before:always;margin-top:20px;padding-top:15px;border-top:2px solid #ccc}
  .tbl{display:table;width:100%;border-collapse:collapse;margin:10px 0}
  .tbl th,.tbl td{border:1px solid #888;padding:4px 6px;font-size:8.5pt}
  .tbl tr:hover{background:transparent}
  input.inp,select.inp{border:none!important;background:transparent!important;padding:0 2px!important;font-size:8.5pt!important;appearance:none;-webkit-appearance:none}
  .grid2{grid-template-columns:repeat(3,1fr)}
  label{font-size:8pt;color:#333}
  .cards{display:flex;flex-wrap:wrap;gap:6px}
  .card-ind{border:1px solid #bbb;background:#f7f7f7;padding:6px;margin-bottom:6px;box-shadow:none;page-break-inside:avoid}
  .card-ind .val{font-size:10pt}
  .note,.hint,.info{font-size:8pt}
  .foot{border-top:1px solid #aaa;font-size:8pt}
}
@media (max-width:640px){.tbl{display:block;overflow-x:auto;white-space:nowrap}.brand-sub{display:none}.content{padding:16px 12px}.topbar{padding:12px}}
</style>
</head>
<body>
<div class="app-root" id="root"></div>
<div class="modal" id="modal"><div class="modal-card"><h4 id="modal-title">Aviso</h4><p id="modal-text"></p><button class="btn-reset" id="modal-ok" style="border-color:var(--accent);color:var(--accent)">Fechar</button></div></div>
<script>
"use strict";
const defValue = v => (v === "" || v === null || v === undefined ? 0 : Number(v));
const seguranca = x => (typeof x === "number" && isFinite(x) && !isNaN(x) ? x : 0);
const fmt = (v, d = 2) => {
  if (v === null || v === undefined) return "—";
  if (typeof v !== "number" || !isFinite(v) || isNaN(v)) return "—";
  return v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
};
const fmtMoeda = v => {
  if (v === null || v === undefined) return "—";
  if (typeof v !== "number" || !isFinite(v) || isNaN(v)) return "—";
  return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
};
function computeAll(S) {
  const q = S.quantitativos, p = S.percentuais, cul = S.cultivo;
  const periodoCultivo = cul.dataEstocagem && cul.dataDespesca
    ? Math.round((new Date(cul.dataDespesca) - new Date(cul.dataEstocagem)) / 86400000) : 0;

  const totalMaquinas = S.maquinas.reduce((s, i) => s + defValue(i.qtd) * defValue(i.preco), 0);
  const totalMateriais = S.materiais.reduce((s, i) => s + defValue(i.qtd) * defValue(i.preco), 0) + defValue(S.maoDeObraConstrucao);
  const valorEquipamentos = S.equipamentos.reduce((s, i) => s + defValue(i.qtd) * defValue(i.preco), 0);
  const deprecEquip = S.equipamentos.reduce((s, i) =>
    s + (defValue(i.vidaUtil) > 0 ? (defValue(i.qtd) * defValue(i.preco)) / defValue(i.vidaUtil) : 0), 0);

  const alevinosTotalQtd = defValue(q.alevinosQtd);
  const alevinosPrecoMedio = alevinosTotalQtd > 0 ? (alevinosTotalQtd * defValue(q.alevinosPrecoUnit)) / alevinosTotalQtd : 0;

  const estercoTon = defValue(p.producaoEstercoDia) > 0 && defValue(p.materiaSecaEsterco) > 0
    ? (defValue(q.animais) * defValue(q.pesoAnimais) * (defValue(p.producaoEstercoDia) / 100) * periodoCultivo) / 1000 : 0;

  const volumeAterro = defValue(q.comprimentoAterro) > 0 && defValue(q.alturaAterro) > 0
    ? ((defValue(q.baseMaiorAterro) + defValue(q.baseMenorAterro)) / 2) * defValue(q.comprimentoAterro) * defValue(q.alturaAterro) * 1.2 : 0;
  const horasMaquinasCalc = volumeAterro > 0 ? volumeAterro / 30 : 0;
  const horasMaquinaTotal = defValue(q.horasMaquinaManual) || horasMaquinasCalc;

  const producaoTotalKg = S.especies.reduce((s, e) => s + defValue(e.qtd), 0);
  const receitaPescado = S.especies.reduce((s, e) => s + defValue(e.qtd) * defValue(e.precoUnit), 0);
  const receitaBruta = receitaPescado + defValue(S.outrasReceitas);
  const precoMedioVenda = producaoTotalKg > 0 ? receitaPescado / producaoTotalKg : 0;
  const pesoMedioFinalGlobal = producaoTotalKg > 0
    ? (S.especies.reduce((s, e) => s + defValue(e.qtd) * defValue(e.pesoMedioFinal), 0) / producaoTotalKg) : 0;
  const biomassaInicial = (defValue(q.alevinosPesoMedio) * alevinosTotalQtd) / 1000;

  const depConstrucao = defValue(S.vidaUtilConstrucao) > 0 ? (totalMaquinas / defValue(S.vidaUtilConstrucao)) * 0.9 : 0;
  const depAbastecimento = defValue(S.vidaUtilConstrucao) > 0 ? (totalMateriais / defValue(S.vidaUtilConstrucao)) * 0.9 : 0;
  const custoTotalViveiro = totalMaquinas + totalMateriais + valorEquipamentos;
  const depreciacaoAnualTotal = depConstrucao + depAbastecimento + deprecEquip;

  const coeItens = [
    { nome: "Alevinos", valor: alevinosTotalQtd * alevinosPrecoMedio },
    { nome: "Mão de obra + encargos", valor: defValue(q.maoDeObraCultivoHoras) * defValue(q.maoDeObraCultivoValor) },
    { nome: "Alimentação/ração", valor: defValue(q.racao1Qtd) * defValue(q.racao1Preco) + defValue(q.racao2Qtd) * defValue(q.racao2Preco) },
    { nome: "Fertilizantes orgânicos", valor: defValue(q.fertOrg1Qtd) * defValue(q.fertOrg1Preco) + defValue(q.fertOrg2Qtd) * defValue(q.fertOrg2Preco) },
    { nome: "Fertilizantes químicos", valor: defValue(q.fertQuim1Qtd) * defValue(q.fertQuim1Preco) + defValue(q.fertQuim2Qtd) * defValue(q.fertQuim2Preco) },
    { nome: "Calagem", valor: defValue(q.calcarioQtd) * defValue(q.calcarioPreco) + defValue(q.calVirgemQtd) * defValue(q.calVirgemPreco) },
    { nome: "Combustível", valor: defValue(q.combustivelQtd) * defValue(q.combustivelPreco) },
    { nome: "Energia elétrica", valor: defValue(q.energiaQtd) * defValue(q.energiaPreco) },
    { nome: "Análise da água", valor: defValue(q.analiseAguaQtd) * defValue(q.analiseAguaPreco) },
    { nome: "Transporte", valor: defValue(q.transporteQtd) * defValue(q.transportePreco) },
    { nome: "Assistência técnica", valor: defValue(q.assistenciaQtd) * defValue(q.assistenciaPreco) },
    { nome: "Gastos administrativos e financeiros", valor: defValue(q.gastosAdm) },
    { nome: "Medicamentos e produtos químicos", valor: defValue(q.medicamentos) },
    { nome: "Outros custos operacionais", valor: defValue(q.outrosOperacionais) },
    { nome: "Manutenção", valor: defValue(S.manutencaoConstrucao) + defValue(S.manutencaoEquipamentos) },
    { nome: "Arrendamento", valor: defValue(q.arrendamento) }
  ];
  const coeTotal = coeItens.reduce((s, i) => s + i.valor, 0);
  const cotTotal = coeTotal + defValue(q.proLaboreSalario) + depreciacaoAnualTotal;
  const jurosCapital = (defValue(p.jurosCapital) / 100) * custoTotalViveiro;
  const jurosTerra = defValue(q.precoTerra) * defValue(q.terraHa) * defValue(p.jurosTerra) / 100;
  const custoOportunidade = jurosCapital + jurosTerra;
  const custoTotal = cotTotal + custoOportunidade;

  const racaoQtdTotal = defValue(q.racao1Qtd) + defValue(q.racao2Qtd);
  const ind = {
    periodoCultivo,
    areaViveiro: defValue(cul.areaViveiro),
    quantidadePeixes: seguranca(producaoTotalKg / pesoMedioFinalGlobal),
    densidade: seguranca(alevinosTotalQtd / (defValue(cul.areaViveiro) * 10000)),
    sobrevivencia: seguranca(((producaoTotalKg * 1000 / pesoMedioFinalGlobal) * 100) / alevinosTotalQtd),
    taxaCrescimento: seguranca((pesoMedioFinalGlobal - defValue(q.alevinosPesoMedio)) / periodoCultivo),
    produtividade: seguranca(producaoTotalKg * 365 / (defValue(cul.areaViveiro) * periodoCultivo)),
    conversaoAlimentar: seguranca(racaoQtdTotal / (producaoTotalKg - biomassaInicial)),
    rb: receitaBruta,
    rbKg: seguranca(receitaBruta / producaoTotalKg),
    coe: coeTotal,
    coeKg: seguranca(coeTotal / producaoTotalKg),
    cot: cotTotal,
    cotKg: seguranca(cotTotal / producaoTotalKg),
    ct: custoTotal,
    ctKg: seguranca(custoTotal / producaoTotalKg),
    mbu: seguranca((receitaBruta - coeTotal) / producaoTotalKg),
    mb: seguranca(((receitaBruta - coeTotal) / receitaBruta) * 100),
    mlu: seguranca((receitaBruta - cotTotal) / producaoTotalKg),
    ml: seguranca(((receitaBruta - cotTotal) / receitaBruta) * 100),
    nivelamentoCOE: seguranca(coeTotal / precoMedioVenda),
    nivelamentoCOT: seguranca(cotTotal / precoMedioVenda),
    prelonCOE: seguranca(coeTotal / producaoTotalKg),
    prelonCOT: seguranca(cotTotal / producaoTotalKg),
    pontoEquilibrioOp: seguranca(depreciacaoAnualTotal / (precoMedioVenda - seguranca(coeTotal / producaoTotalKg))),
    custoRacaoKg: seguranca((defValue(q.racao1Qtd) * defValue(q.racao1Preco) + defValue(q.racao2Qtd) * defValue(q.racao2Preco)) / producaoTotalKg),
    custoFertKg: seguranca((defValue(q.fertOrg1Qtd) * defValue(q.fertOrg1Preco) + defValue(q.fertOrg2Qtd) * defValue(q.fertOrg2Preco)) / producaoTotalKg),
    custoMaoObraKg: seguranca((defValue(q.maoDeObraCultivoHoras) * defValue(q.maoDeObraCultivoValor) + defValue(q.proLaboreSalario)) / producaoTotalKg),
    recuperacaoCapital: seguranca(custoTotalViveiro / ((receitaBruta - cotTotal) + depreciacaoAnualTotal)),
    custoImplantacao: custoTotalViveiro
  };

  const bioValidas = S.biometrias.map((b, idx) => {
    if (!b.data || b.pesoMedio === "" || Number(b.pesoMedio) <= 0) return null;
    const dias = cul.dataEstocagem ? Math.round((new Date(b.data) - new Date(cul.dataEstocagem)) / 86400000) : null;
    return {
      idx: idx + 1,
      rowIdx: idx,
      data: b.data,
      dias: (dias !== null && !isNaN(dias) && dias >= 0) ? dias : null,
      peso: Number(b.pesoMedio),
      racaoAcum: b.racaoAcumulada !== "" && b.racaoAcumulada !== undefined ? Number(b.racaoAcumulada) : null,
      mortAcum: b.mortalidade !== "" && b.mortalidade !== undefined ? Number(b.mortalidade) : 0
    };
  }).filter(Boolean);

  const pesoInicialEstocagem = defValue(q.alevinosPesoMedio);
  const qtdInicial = defValue(q.alevinosQtd);
  const biomassaIniKg = (pesoInicialEstocagem * qtdInicial) / 1000;

  const bioComp = bioValidas.map((b, i) => {
    const prev = i > 0 ? bioValidas[i - 1] : null;
    let diasPeriodo = 0;
    let pesoAnterior = pesoInicialEstocagem;
    let biomassaAnteriorKg = biomassaIniKg;

    if (prev) {
      diasPeriodo = Math.round((new Date(b.data) - new Date(prev.data)) / 86400000);
      pesoAnterior = prev.peso;
      const peixesPrev = Math.max(0, qtdInicial - prev.mortAcum);
      biomassaAnteriorKg = (prev.peso * peixesPrev) / 1000;
    } else if (b.dias !== null && b.dias > 0) {
      diasPeriodo = b.dias;
      pesoAnterior = pesoInicialEstocagem > 0 ? pesoInicialEstocagem : b.peso;
      biomassaAnteriorKg = pesoInicialEstocagem > 0 ? biomassaIniKg : (b.peso * qtdInicial) / 1000;
    }

    const peixesVivos = Math.max(0, qtdInicial - b.mortAcum);
    const biomassaKg = (b.peso * peixesVivos) / 1000;

    // Ganho de peso médio diário (g/dia) no período e acumulado
    const gpdPeriodo = diasPeriodo > 0 ? (b.peso - pesoAnterior) / diasPeriodo : 0;
    const basePesoAcum = pesoInicialEstocagem > 0 ? pesoInicialEstocagem : (bioValidas[0] ? bioValidas[0].peso : b.peso);
    const diasAcumulados = b.dias !== null ? b.dias : (i > 0 ? Math.round((new Date(b.data) - new Date(bioValidas[0].data)) / 86400000) : 0);
    const gpdAcumulado = diasAcumulados > 0 ? (b.peso - basePesoAcum) / diasAcumulados : 0;

    // Ganho de biomassa diário (kg/dia) no período e acumulado
    const ganhoBiomassaPeriodoDia = diasPeriodo > 0 ? (biomassaKg - biomassaAnteriorKg) / diasPeriodo : 0;
    const baseBiomassaAcum = biomassaIniKg > 0 ? biomassaIniKg : (bioValidas[0] ? (bioValidas[0].peso * Math.max(0, qtdInicial - bioValidas[0].mortAcum)) / 1000 : biomassaKg);
    const ganhoBiomassaAcumDia = diasAcumulados > 0 ? (biomassaKg - baseBiomassaAcum) / diasAcumulados : 0;

    // Taxa de Crescimento Específico (TCE %/dia) = ((ln(Pf) - ln(Pi)) / dias) * 100
    const tcePeriodo = (diasPeriodo > 0 && pesoAnterior > 0 && b.peso > 0)
      ? ((Math.log(b.peso) - Math.log(pesoAnterior)) / diasPeriodo) * 100 : 0;
    const tceAcumulada = (diasAcumulados > 0 && basePesoAcum > 0 && b.peso > 0)
      ? ((Math.log(b.peso) - Math.log(basePesoAcum)) / diasAcumulados) * 100 : 0;

    // Conversão Alimentar (FCA) estimada no período e acumulada
    const ganhoBiomassaPeriodo = biomassaKg - biomassaAnteriorKg;
    const ganhoBiomassaAcum = biomassaKg - baseBiomassaAcum;
    const racaoPeriodo = prev && prev.racaoAcum !== null && b.racaoAcum !== null
      ? Math.max(0, b.racaoAcum - prev.racaoAcum)
      : (b.racaoAcum !== null ? b.racaoAcum : null);

    const fcaPeriodo = (racaoPeriodo !== null && racaoPeriodo > 0 && ganhoBiomassaPeriodo > 0)
      ? racaoPeriodo / ganhoBiomassaPeriodo : null;
    const fcaAcumulada = (b.racaoAcum !== null && b.racaoAcum > 0 && ganhoBiomassaAcum > 0)
      ? b.racaoAcum / ganhoBiomassaAcum : null;

    return {
      idx: b.idx,
      rowIdx: b.rowIdx,
      data: b.data,
      dias: diasAcumulados,
      diasPeriodo,
      peso: b.peso,
      peixesVivos,
      biomassaKg,
      gpdPeriodo,
      gpdAcumulado,
      ganhoBiomassaPeriodoDia,
      ganhoBiomassaAcumDia,
      tcePeriodo,
      tceAcumulada,
      racaoAcum: b.racaoAcum,
      fcaPeriodo,
      fcaAcumulada,
      pec: (defValue(cul.areaViveiro) > 0) ? (biomassaKg / defValue(cul.areaViveiro)) : 0,
      produtividade: (defValue(cul.areaViveiro) > 0 && diasAcumulados > 0) ? (biomassaKg * 365) / (defValue(cul.areaViveiro) * diasAcumulados) : 0
    };
  });

  return {
    S, D: {
      periodoCultivo, totalMaquinas, totalMateriais, valorEquipamentos, deprecEquip,
      alevinosTotalQtd, alevinosPrecoMedio, estercoTon, volumeAterro, horasMaquinasCalc, horasMaquinaTotal,
      producaoTotalKg, receitaBruta, receitaPescado, precoMedioVenda, pesoMedioFinalGlobal, biomassaInicial,
      depConstrucao, depAbastecimento, custoTotalViveiro, depreciacaoAnualTotal,
      coeItens, coeTotal, cotTotal, jurosCapital, jurosTerra, custoOportunidade, custoTotal,

function persist() {

    saveStatus = "Salvo automaticamente às " + now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    updateSaveBadge();
  } catch (e) {
    saveStatus = "Sem armazenamento interno — use Salvar/Carregar.";
  }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const st = JSON.parse(raw);
    if (st && typeof st === "object") return st;
  } catch (e) {}
  return null;
}
function updateSaveBadge() {
  const b = document.getElementById("save-badge");
  if (b) b.textContent = saveStatus;
}
function deepMerge(base, over) {
  if (Array.isArray(over)) {
    const out = Array.isArray(base) ? base.slice() : [];
    over.forEach((v, i) => { out[i] = deepMerge(out[i], v); });
    return out;
  }
  if (over !== null && typeof over === "object") {
    const out = base !== null && typeof base === "object" ? { ...base } : {};
    Object.keys(over).forEach(k => { out[k] = deepMerge(out[k], over[k]); });
    return out;
  }
  return over === undefined ? base : over;
}
function exportJSON() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "precificador-piscicultura-dados.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  showToast("Arquivo de dados gerado com sucesso.");
}
function pickJSONFile(cb) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => { if (inp.files && inp.files[0]) cb(inp.files[0]); };
  inp.click();
}
function importJSONFile(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const st = JSON.parse(fr.result);
      if (!st || typeof st !== "object" || Array.isArray(st)) throw new Error();
      S = deepMerge(defaultState(), st);
      if (!S.analises) S.analises = parametrosPadraoToAnalises();
      initAnaliseDates();
      persist(); render();
      showToast("Dados carregados com sucesso!");
    } catch (e) {
      showToast("Arquivo inválido.", true);
    }
  };
  fr.readAsText(file);
}
function showToast(msg, isError) {
  const t = document.createElement("div");
  t.className = "toast" + (isError ? " err" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add("show"));
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => { if (t.parentNode) t.remove(); }, 400); }, 3400);
}
function parametrosPadraoToAnalises() {
  const pp = defaultState().parametrosPadrao;
  return pp.map(p => ({ parametro: p, data: "", resultado: "" }));
}
function initAnaliseDates() {
  if (!S.analises || !S.analises.length) {
    S.analises = parametrosPadraoToAnalises();
    return;
  }
  const d = (S.cultivo && S.cultivo.dataAnalise) ? S.cultivo.dataAnalise : hojeISO();
  S.analises.forEach(a => { if (!a.data && d) a.data = d; });
}

function setPath(obj, path, val) {
  const parts = String(path).split(".");
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const k = parts[i];
    if (!(k in cur) || cur[k] == null) return;
    cur = cur[k];
  }
  const last = parts[parts.length - 1];
  if (last === "") return;
  cur[last] = val;
}
function switchTab(id) {
  S.tab = id;
  persist();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function onFieldChange(ev) {
  const el = ev.target.closest("[data-path]");
  if (!el) return;
  const p = el.getAttribute("data-path");
  let v = el.value;
  if (el.getAttribute("data-num") === "1") {
    if (v === "" || v === "-") v = 0; else v = Number(v.replace(",", "."));
    if (isNaN(v)) v = 0;
  }
  setPath(S, p, v);
  persist();
  updateLive();
}


function cardHTML(label, valor, sub, cor) {

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function escAttr(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function inputNum(value, path) {

}
function inputDate(value, path) {
  return '<input type="date" class="inp" data-path="' + escAttr(path) + '" value="' + escAttr(value || "") + '">';
}
function selectHTML(value, path, options) {
  return '<select class="inp" data-path="' + escAttr(path) + '">' + options.map(o => '<option value="' + escAttr(o.v) + '"' + (String(value) === String(o.v) ? " selected" : "") + ">" + esc(o.l) + "</option>").join("") + "</select>";
}
function outSpan(key, cls) {

}

function updateLive() {

    if (txt === null || txt === undefined) return;
    if (el.tagName === "INPUT") { if (el.value !== txt) el.value = txt; }
    else if (el.innerHTML !== txt) el.innerHTML = txt;

function precoSugerido(D) {
  const base = D.ind[D.markupModalidade === "cot" ? "cotKg" : "ctKg"];
  return base > 0 ? base * (1 + D.margemMarkup / 100) : 0;

function precCenariosHTML(D) {
  const base = D.ind[D.markupModalidade === "cot" ? "cotKg" : "ctKg"];
  return [10, 20, 30, 40, 50, 60, 80, 100].map(mk => {
    const pr = base * (1 + mk / 100);
    const lu = pr - (D.ind.ctKg || 0);
    return '<tr><td>' + mk + '%</td><td class="calc">' + fmtMoeda(pr) + '</td><td class="calc">' + fmtMoeda(lu) + '</td></tr>';
  }).join("");
}

    cardHTML("Ganho Biomassa Diário", last && last.ganhoBiomassaAcumDia > 0 ? fmt(last.ganhoBiomassaAcumDia, 2) + " kg/dia" : "—", last && last.ganhoBiomassaPeriodoDia > 0 ? "Último período: " + fmt(last.ganhoBiomassaPeriodoDia, 2) + " kg/dia" : "Incremento diário do tanque", "blue") +
    cardHTML("Taxa Cresc. Específico (TCE)", last && last.tceAcumulada > 0 ? fmt(last.tceAcumulada, 2) + " %/dia" : "—", last && last.tcePeriodo > 0 ? "Último período: " + fmt(last.tcePeriodo, 2) + " %/dia" : "Crescimento relativo diário", "purple") +
    cardHTML("Conversão Alimentar (FCA)", (last && last.fcaAcumulada !== null) ? fmt(last.fcaAcumulada, 2) : (D.ind.conversaoAlimentar > 0 ? fmt(D.ind.conversaoAlimentar, 2) + " (ciclo)" : "—"), (last && last.fcaPeriodo !== null) ? "Último período: " + fmt(last.fcaPeriodo, 2) : "Preencha ração acumulada (kg)", "orange") +
  '</div>';

  // Gráfico SVG de evolução do peso dos peixes
  const pts = [];
  if (S.cultivo.dataEstocagem && pesoIni > 0) {
    pts.push({ label: "Estoc. (0d)", peso: pesoIni, dias: 0, biomassa: (pesoIni * qtdIni) / 1000 });
  }
  list.forEach(b => {
    pts.push({ label: "#" + b.idx + " (" + b.dias + "d)", peso: b.peso, dias: b.dias, biomassa: b.biomassaKg });
  });

  let chartHTML = '<div style="background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">' +
      '<strong style="font-size:.92rem;color:var(--ink)">📈 Curva de Evolução do Peso Médio (g)</strong>' +
      '<span style="font-size:.76rem;color:var(--ink2)">Atualizado automaticamente conforme as pesagens</span>' +
    '</div>';

  if (pts.length < 2) {
    chartHTML += '<div style="padding:28px 12px;text-align:center;color:var(--ink2);font-size:.84rem;border:1px dashed var(--line);border-radius:8px">' +
      'Insira pelo menos <b>duas biometrias</b> (ou a data/peso inicial de estocagem na aba ①/② + uma biometria) para visualizar o gráfico de crescimento.' +
    '</div>';
  } else {
    const W = 760, H = 250, padL = 54, padR = 24, padT = 24, padB = 42;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const maxPeso = Math.max(...pts.map(p => p.peso)) * 1.12;
    const minPeso = 0;

    const coords = pts.map((p, i) => {
      const x = padL + (pts.length === 1 ? plotW / 2 : (i / (pts.length - 1)) * plotW);
      const y = padT + plotH - ((p.peso - minPeso) / (maxPeso - minPeso || 1)) * plotH;
      return { ...p, x, y };
    });

    const linePoints = coords.map(c => c.x.toFixed(1) + "," + c.y.toFixed(1)).join(" ");
    const areaPoints = coords[0].x.toFixed(1) + "," + (padT + plotH) + " " + linePoints + " " + coords[coords.length - 1].x.toFixed(1) + "," + (padT + plotH);

    // Linhas de grade horizontais (4 níveis)
    let gridLines = "";
    for (let g = 0; g <= 4; g++) {
      const val = (maxPeso / 4) * g;
      const gy = padT + plotH - (g / 4) * plotH;
      gridLines += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '" stroke="var(--line)" stroke-dasharray="3,3" stroke-width="1"/>';
      gridLines += '<text x="' + (padL - 8) + '" y="' + (gy + 4).toFixed(1) + '" text-anchor="end" fill="var(--ink2)" font-size="11">' + fmt(val, 0) + 'g</text>';
    }

    const dots = coords.map(c =>
      '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>' + esc(c.label) + ': ' + fmt(c.peso, 1) + ' g</title></circle>' +
      '<text x="' + c.x.toFixed(1) + '" y="' + (c.y - 10).toFixed(1) + '" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="700">' + fmt(c.peso, 0) + 'g</text>' +
      '<text x="' + c.x.toFixed(1) + '" y="' + (padT + plotH + 18) + '" text-anchor="middle" fill="var(--ink2)" font-size="10.5">' + esc(c.label) + '</text>'
    ).join("");

    chartHTML += '<div style="width:100%;overflow-x:auto">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;min-width:520px;height:auto;display:block">' +
        '<defs><linearGradient id="bioGrad" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="#0e7490" stop-opacity="0.28"/>' +
          '<stop offset="100%" stop-color="#0e7490" stop-opacity="0.02"/>' +
        '</linearGradient></defs>' +
        gridLines +
        '<polygon points="' + areaPoints + '" fill="url(#bioGrad)"/>' +
        '<polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="' + linePoints + '"/>' +
        dots +
      '</svg></div>';
  }
  chartHTML += '</div>';

  return cards + chartHTML;
}

function tabBiometriasHTML() {
  const D = computeAll(S).D;
  const alertas = [];
  if (!S.cultivo.dataEstocagem) alertas.push("Data de estocagem (aba ①)");
  if (!defValue(S.quantitativos.alevinosQtd)) alertas.push("Quantidade de alevinos (aba ②)");
  if (!defValue(S.quantitativos.alevinosPesoMedio)) alertas.push("Peso médio inicial dos alevinos (aba ②)");

  return '<section class="fade"><h2>Acompanhamento Técnico & Biometrias</h2>' +
      '<p class="hint">Registre as amostragens periódicas para acompanhar ganho de peso, biomassa, TCE, conversão alimentar e curva de crescimento.</p>' +
      (alertas.length ? '<div class="info">💡 <b>Dica de conexão:</b> Para cálculos completos de biomassa e início do ciclo, preencha também: ' + alertas.join(", ") + '.</div>' : '') +
      '<div id="bio-dashboard">' + renderBioDashboardHTML(D) + '</div>' +
      '<h3>Registro de Amostragens e Indicadores por Biometria</h3>' +
      '<table class="tbl"><thead><tr>' +
        '<th>#</th>' +
        '<th>Data</th>' +
        '<th>Dias (ciclo)</th>' +
        '<th>Peso médio (g)</th>' +
        '<th>Mort. acum. (un)</th>' +
        '<th>Ração acum. (kg)</th>' +
        '<th>GPD período (g/dia)</th>' +
        '<th>Biomassa est. (kg)</th>' +
        '<th>Ganho biom. (kg/dia)</th>' +
        '<th>TCE (%/dia)</th>' +
        '<th>FCA est.</th>' +
      '</tr></thead><tbody>' +
      S.biometrias.map((b, i) =>
        '<tr>' +
          '<td><b>' + (i + 1) + '</b></td>' +
          '<td>' + inputDate(b.data, "biometrias." + i + ".data") + '</td>' +
          '<td class="calc">' + outSpan("bio-dias/" + i) + '</td>' +
          '<td>' + inputNum(b.pesoMedio, "biometrias." + i + ".pesoMedio") + '</td>' +
          '<td>' + inputNum(b.mortalidade, "biometrias." + i + ".mortalidade") + '</td>' +
          '<td>' + inputNum(b.racaoAcumulada, "biometrias." + i + ".racaoAcumulada") + '</td>' +
          '<td class="calc">' + outSpan("bio-gpd/" + i) + '</td>' +
          '<td class="calc">' + outSpan("bio-biom/" + i) + '</td>' +
          '<td class="calc">' + outSpan("bio-gbiom/" + i) + '</td>' +
          '<td class="calc">' + outSpan("bio-tce/" + i) + '</td>' +
          '<td class="calc">' + outSpan("bio-fca/" + i) + '</td>' +
        '</tr>'
      ).join("") +
      '</tbody></table>' +
      '<div class="info" id="bio-info">Preencha as pesagens acima — os indicadores aparecem automaticamente.</div>' +
      '<details class="orient"><summary>Fórmulas zootécnicas aplicadas nesta aba</summary><ul>' +
        '<li><b>GPD (Ganho de Peso Diário):</b> (Peso atual − Peso anterior) ÷ Dias no intervalo (em g/dia).</li>' +
        '<li><b>Biomassa Estimada:</b> (Peso médio × Peixes vivos estimados) ÷ 1.000 (em kg).</li>' +
        '<li><b>Ganho de Biomassa Diário:</b> (Biomassa atual − Biomassa anterior) ÷ Dias no intervalo (em kg/dia).</li>' +
        '<li><b>TCE (Taxa de Crescimento Específico):</b> [(ln Peso atual − ln Peso anterior) ÷ Dias] × 100 (em %/dia).</li>' +
        '<li><b>FCA (Conversão Alimentar):</b> Ração fornecida no intervalo ÷ Ganho de biomassa no mesmo intervalo.</li>' +
      '</ul></details></section>';
}

function tabAnalisesHTML() {
  return '<section class="fade"><h2>Análises de água</h2>' +
      '<table class="tbl"><thead><tr><th>Parâmetro</th><th>Data</th><th>Resultado</th></tr></thead><tbody>' +
      S.analises.map((a, i) => '<tr><td>' + esc(a.parametro) + '</td><td>' + inputDate(a.data, "analises." + i + ".data") + '</td><td>' + inputTxt(a.resultado, "analises." + i + ".resultado") + '</td></tr>').join("") +
      '</tbody></table></section>';
}

function resolveOut(key, D, S) {
  switch (key) {
    case "periodo": return fmt(D.periodoCultivo, 0) + " dias";
    case "producao-total": return fmt(D.producaoTotalKg, 0) + " kg";
    case "receita-bruta": return fmtMoeda(D.receitaBruta);
    case "preco-medio-venda": return fmtMoeda(D.precoMedioVenda) + "/kg";
    case "sub-maq": return fmtMoeda(D.totalMaquinas);
    case "sub-mat": return fmtMoeda(D.totalMateriais);
    case "sub-eq": return fmtMoeda(D.valorEquipamentos);
    case "dep-constr": return fmtMoeda(D.depConstrucao);
    case "dep-eq": return fmtMoeda(D.deprecEquip);
    case "v-moc": return fmtMoeda(defValue(S.maoDeObraConstrucao));
    case "out-alev": return fmtMoeda(D.coeItens[0].valor);
    case "out-mob": return fmtMoeda(D.coeItens[1].valor);
    case "out-r1": return fmtMoeda(defValue(S.quantitativos.racao1Qtd) * defValue(S.quantitativos.racao1Preco));
    case "out-r2": return fmtMoeda(defValue(S.quantitativos.racao2Qtd) * defValue(S.quantitativos.racao2Preco));
    case "out-fo1": return fmtMoeda(defValue(S.quantitativos.fertOrg1Qtd) * defValue(S.quantitativos.fertOrg1Preco));
    case "out-fo2": return fmtMoeda(defValue(S.quantitativos.fertOrg2Qtd) * defValue(S.quantitativos.fertOrg2Preco));
    case "out-fq1": return fmtMoeda(defValue(S.quantitativos.fertQuim1Qtd) * defValue(S.quantitativos.fertQuim1Preco));
    case "out-fq2": return fmtMoeda(defValue(S.quantitativos.fertQuim2Qtd) * defValue(S.quantitativos.fertQuim2Preco));
    case "out-calc": return fmtMoeda(defValue(S.quantitativos.calcarioQtd) * defValue(S.quantitativos.calcarioPreco));
    case "out-calv": return fmtMoeda(defValue(S.quantitativos.calVirgemQtd) * defValue(S.quantitativos.calVirgemPreco));
    case "out-comb": return fmtMoeda(defValue(S.quantitativos.combustivelQtd) * defValue(S.quantitativos.combustivelPreco));
    case "out-ener": return fmtMoeda(defValue(S.quantitativos.energiaQtd) * defValue(S.quantitativos.energiaPreco));
    case "out-anagua": return fmtMoeda(defValue(S.quantitativos.analiseAguaQtd) * defValue(S.quantitativos.analiseAguaPreco));
    case "out-transp": return fmtMoeda(defValue(S.quantitativos.transporteQtd) * defValue(S.quantitativos.transportePreco));
    case "out-assist": return fmtMoeda(defValue(S.quantitativos.assistenciaQtd) * defValue(S.quantitativos.assistenciaPreco));
    case "out-gadm": return fmtMoeda(defValue(S.quantitativos.gastosAdm));
    case "out-medic": return fmtMoeda(defValue(S.quantitativos.medicamentos));
    case "out-outros": return fmtMoeda(defValue(S.quantitativos.outrosOperacionais));
    case "out-arrend": return fmtMoeda(defValue(S.quantitativos.arrendamento));
    case "out-prolab": return fmtMoeda(defValue(S.quantitativos.proLaboreSalario));
  }
  if (key.indexOf("vmaq/") === 0) { const m = S.maquinas[+key.slice(5)]; return m ? fmtMoeda(defValue(m.qtd) * defValue(m.preco)) : "—"; }
  if (key.indexOf("vmat/") === 0) { const m = S.materiais[+key.slice(5)]; return m ? fmtMoeda(defValue(m.qtd) * defValue(m.preco)) : "—"; }
  if (key.indexOf("veq/") === 0) { const e = S.equipamentos[+key.slice(4)]; return e ? fmtMoeda(defValue(e.qtd) * defValue(e.preco)) : "—"; }
  if (key.indexOf("deq/") === 0) {
    const e = S.equipamentos[+key.slice(4)];
    if (!e) return "—";
    return defValue(e.vidaUtil) > 0 ? fmtMoeda((defValue(e.qtd) * defValue(e.preco)) / defValue(e.vidaUtil)) : "—";
  }
  if (key.indexOf("bio-") === 0) {
    const parts = key.split("/");
    const metric = parts[0];
    const rowIdx = Number(parts[1]);
    const item = D.bioComp.find(x => x.rowIdx === rowIdx);
    if (!item) return "—";
    switch (metric) {
      case "bio-dias": return item.dias !== null ? fmt(item.dias, 0) + " d" : "—";
      case "bio-gpd": return item.gpdPeriodo > 0 ? fmt(item.gpdPeriodo, 2) : "—";
      case "bio-biom": return item.biomassaKg > 0 ? fmt(item.biomassaKg, 1) : "—";
      case "bio-gbiom": return item.ganhoBiomassaPeriodoDia > 0 ? fmt(item.ganhoBiomassaPeriodoDia, 2) : "—";
      case "bio-tce": return item.tcePeriodo > 0 ? fmt(item.tcePeriodo, 2) + "%" : "—";
      case "bio-fca": return item.fcaPeriodo !== null ? fmt(item.fcaPeriodo, 2) : "—";
    }
  }
  return null;
}

function boot() {
  const saved = loadState();
  S = saved ? deepMerge(defaultState(), saved) : defaultState();
  if (!S.analises || !S.analises.length) S.analises = parametrosPadraoToAnalises();
  initAnaliseDates();
  render();
}
boot();
</script>
